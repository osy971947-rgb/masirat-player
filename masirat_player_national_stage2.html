<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚽ مسيرة لاعب — التحديث البصري الثاني</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal','Cairo','Noto Kufi Arabic','Segoe UI',Tahoma,sans-serif;background:radial-gradient(circle at 50% 0%,#0e3323,#050b08 70%);color:#e6f5ec;min-height:100vh;display:flex;justify-content:center;padding:14px}
#app{width:100%;max-width:540px;padding-bottom:40px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(80,230,150,.18);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
h1{font-size:20px;color:#5ee89b;margin-bottom:6px}
h2{font-size:16px;color:#5ee89b;margin-bottom:8px}
h3{font-size:13px;color:#5ee89b;margin:10px 0 6px}
.sub{font-size:12px;color:#8fb8a4;margin-bottom:10px;line-height:1.5}
label{display:block;font-size:12px;color:#9fc9b3;margin:8px 0 5px}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(80,230,150,.25);background:rgba(0,0,0,.35);color:#fff;font-size:14px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:#5ee89b}
button{width:100%;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#1fd67a,#0fa85c);color:#04140c;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;margin-top:8px;transition:transform .1s}
button:active{transform:scale(.98)}
button.ghost{background:rgba(255,255,255,.08);color:#e6f5ec;border:1px solid rgba(80,230,150,.25)}
button.sm{padding:8px;font-size:12px;margin-top:4px}
button.warn{background:linear-gradient(135deg,#e8c05e,#c79a2a);color:#1a1400}
button.gold{background:linear-gradient(135deg,#f4d56a,#c79a2a);color:#1a1400}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.row:last-child{border:none}
.row span:first-child{color:#8fb8a4}
.badge{display:inline-block;background:rgba(94,232,155,.15);color:#5ee89b;padding:3px 8px;border-radius:20px;font-size:11px;margin-inline-end:4px;margin-bottom:4px}
.badge.red{background:rgba(255,100,100,.2);color:#ff7b7b}
.badge.gold{background:rgba(232,192,94,.2);color:#e8c05e}
.score{font-size:32px;font-weight:800;text-align:center;letter-spacing:2px;margin:8px 0}
.score small{font-size:13px;color:#8fb8a4;display:block;letter-spacing:0;font-weight:400;margin:5px 0}
.rating-box{text-align:center;margin:10px 0}
.rating{font-size:40px;font-weight:800;color:#5ee89b;line-height:1}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:8px}
.stat{background:rgba(0,0,0,.3);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:18px;color:#5ee89b}
.stat span{font-size:10px;color:#8fb8a4}
.log-item{font-size:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.log-item:last-child{border:none}
.log-item.ok{color:#5ee89b}
.log-item.bad{color:#ff7b7b}
.log-item.gold{color:#e8c05e}
table{width:100%;font-size:10.5px;border-collapse:collapse}
th,td{padding:3px 2px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06)}
th{color:#8fb8a4;font-weight:400;font-size:10px}
td:first-child{text-align:right;color:#e6f5ec;font-size:10.5px}
.zone-cl{background:rgba(94,232,155,.10)}
.zone-eu{background:rgba(94,180,232,.10)}
.zone-rel{background:rgba(255,100,100,.10)}
.bar{height:6px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden;margin-top:4px}
.bar-fill{height:100%;background:linear-gradient(90deg,#1fd67a,#5ee89b);transition:width .3s}
.bar-fill.warn{background:linear-gradient(90deg,#e8c05e,#f0d478)}
.bar-fill.danger{background:linear-gradient(90deg,#ff5e5e,#ff8a8a)}
.bar-fill.gold{background:linear-gradient(90deg,#e8c05e,#f4d56a)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 10px;border-radius:20px;background:rgba(255,255,255,.06);font-size:12px;cursor:pointer;white-space:nowrap;border:1px solid transparent;color:#c8dccd}
.tab.active{background:rgba(94,232,155,.15);border-color:#5ee89b;color:#5ee89b}
.event-box{background:rgba(94,232,155,.06);border:1px solid rgba(94,232,155,.25);border-radius:12px;padding:12px;margin:8px 0}
.event-box.derby{background:rgba(255,100,100,.08);border-color:rgba(255,100,100,.4)}
.event-box.gold{background:rgba(232,192,94,.1);border-color:rgba(232,192,94,.5)}
.option{padding:10px;background:rgba(255,255,255,.05);border-radius:10px;margin-top:6px;cursor:pointer;font-size:13px;border:1px solid rgba(255,255,255,.1);transition:background .15s}
.option:active{background:rgba(94,232,155,.15)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;margin-inline-start:4px}
.pill.g{background:rgba(94,232,155,.2);color:#5ee89b}
.pill.y{background:rgba(232,192,94,.2);color:#e8c05e}
.pill.r{background:rgba(255,100,100,.2);color:#ff7b7b}
.notif{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#1fd67a,#0fa85c);color:#04140c;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:slidein .3s ease;max-width:90%}
@keyframes slidein{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
.trait{display:inline-block;padding:3px 8px;border-radius:10px;font-size:11px;background:rgba(94,180,232,.15);color:#79c9f0;margin:2px 0}
.trophy-big{font-size:60px;text-align:center;margin:12px 0}
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ach{background:rgba(0,0,0,.3);border-radius:10px;padding:8px;font-size:11px;border:1px solid rgba(94,232,155,.15);opacity:.5}
.ach.unlocked{opacity:1;border-color:#5ee89b;background:rgba(94,232,155,.1)}
.ach b{display:block;font-size:12px;color:#5ee89b;margin-bottom:2px}
.ach span{color:#8fb8a4;font-size:10px}
.asset{background:rgba(0,0,0,.3);border-radius:10px;padding:10px;margin-top:6px;font-size:12px}
.asset b{color:#5ee89b}
.pitch{background:linear-gradient(0deg,#1a4a2e,#0e3323);border-radius:10px;padding:8px;position:relative;aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:space-between;border:2px solid rgba(94,232,155,.2)}
.pitch-zone{flex:1;display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(255,255,255,.7);border-bottom:1px dashed rgba(255,255,255,.15);text-align:center}
.pitch-zone:last-child{border-bottom:none}
.pitch-zone b{font-size:16px;color:#5ee89b;display:block}
.award-scene{text-align:center;background:linear-gradient(160deg,rgba(232,192,94,.15),rgba(232,192,94,.03));border:1px solid rgba(232,192,94,.4)}
.confetti{font-size:32px;letter-spacing:6px;margin:8px 0;animation:bounce 1s infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.challenge{background:rgba(94,180,232,.08);border:1px solid rgba(94,180,232,.25);border-radius:10px;padding:10px;margin-top:6px;font-size:12px}
.challenge b{color:#79c9f0;display:block;margin-bottom:4px}
.challenge .prog{font-size:11px;color:#8fb8a4}
.scorer-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px}
.scorer-row:last-child{border:none}
.scorer-row.me{background:rgba(94,232,155,.1);border-radius:6px;padding-inline:6px;color:#5ee89b;font-weight:700}

/* تطوير مسيرة اللاعب: التشكيلة والتطوير والتعافي */
.player-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid rgba(94,232,155,.16);border-radius:12px;margin-top:8px;background:rgba(255,255,255,.025);cursor:pointer}
.player-row:hover{background:rgba(94,232,155,.08)}
.player-avatar{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(145deg,#1a6a46,#123625);font-size:21px;flex-shrink:0}
.player-meta{flex:1;min-width:0}.player-meta b{display:block}.player-meta small{display:block;color:#91b6a2;margin-top:3px}
.player-ovr{font-size:20px;font-weight:800;color:#5ee89b;min-width:35px;text-align:center}
.profile-box{margin-top:12px;border:1px solid rgba(94,232,155,.25);border-radius:14px;padding:12px;background:rgba(94,232,155,.04)}
.skill-line{display:grid;grid-template-columns:86px 1fr 30px;align-items:center;gap:8px;margin:8px 0;font-size:12px}
.skill-track{height:7px;border-radius:99px;background:#152b21;overflow:hidden}.skill-track i{display:block;height:100%;background:linear-gradient(90deg,#219963,#8bf0b2);border-radius:99px}
.small-pill{display:inline-block;padding:4px 7px;border-radius:999px;background:rgba(94,232,155,.09);border:1px solid rgba(94,232,155,.2);font-size:11px;margin:2px}


/* التحديث الكبير: الوجوه، الجوال، مسارات الأسطورة والتقويم */
.face-avatar{width:46px;height:46px;flex-shrink:0;border-radius:13px;overflow:hidden;border:1px solid rgba(94,232,155,.35);background:#14291e;display:inline-flex;align-items:center;justify-content:center}
.face-avatar svg{width:100%;height:100%;display:block}
.phone-screen{border:1px solid rgba(94,232,155,.28);border-radius:20px;padding:14px;background:linear-gradient(160deg,#12271c,#07110c);}
.social-post{padding:11px;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);margin-top:8px}
.path-card{border:1px solid rgba(232,192,94,.28);border-radius:14px;padding:12px;margin-top:9px;background:rgba(232,192,94,.04)}
.path-card.active{border-color:#e8c05e;background:rgba(232,192,94,.11)}
.path-head{display:flex;align-items:center;gap:10px}.path-icon{font-size:28px;width:42px;text-align:center}
.path-progress{height:8px;background:#16251d;border-radius:99px;overflow:hidden;margin:7px 0}.path-progress i{display:block;height:100%;background:linear-gradient(90deg,#c79a2a,#f4d56a)}
.news-card{padding:10px;border-right:3px solid #5ee89b;background:rgba(255,255,255,.035);border-radius:9px;margin-top:7px;font-size:12px;line-height:1.6}
.item-card{display:flex;gap:10px;align-items:center;padding:10px;background:rgba(0,0,0,.22);border-radius:12px;margin-top:8px}
@media(min-width:560px){#app{max-width:700px}}
/* تحسينات الإصدار المطوّر: لمس أسهل، تركيز لوحة المفاتيح، وشاشات المباراة */
button{min-height:44px}
button:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #f4d56a;outline-offset:2px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:7px 2px 9px;background:rgba(5,16,10,.92);backdrop-filter:blur(12px);border-radius:0 0 12px 12px}
.tab{min-height:38px;display:inline-flex;align-items:center;justify-content:center}
.tactic-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tactic-card{min-height:138px;text-align:right;padding:13px;border:1px solid rgba(94,232,155,.24);border-radius:14px;background:linear-gradient(155deg,rgba(94,232,155,.10),rgba(255,255,255,.025));color:#e6f5ec;cursor:pointer}
.tactic-card b{display:block;color:#5ee89b;font-size:15px;margin-bottom:7px}
.tactic-card span{display:block;color:#a9c9b7;font-size:12px;line-height:1.55}
.tactic-card:active{transform:scale(.98);background:rgba(94,232,155,.16)}
.save-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match-plan{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(232,192,94,.4);background:rgba(232,192,94,.1);color:#f4d56a;padding:5px 9px;border-radius:999px;font-size:11px;margin:6px 0}
@media(max-width:380px){body{padding:8px}.card{padding:13px}.tactic-grid{grid-template-columns:1fr}.tactic-card{min-height:0}.save-actions{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* نظام مقارنة العروض والتفاوض */
.offer-list{display:grid;gap:9px;margin:12px 0}
.offer-compare-card{border:1px solid rgba(94,232,155,.2);border-radius:14px;padding:12px;background:rgba(0,0,0,.24);cursor:pointer;transition:background .15s,border-color .15s}
.offer-compare-card.selected{border-color:#e8c05e;background:rgba(232,192,94,.09);box-shadow:0 0 0 1px rgba(232,192,94,.12)}
.offer-card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.offer-score{border-radius:999px;padding:4px 8px;background:rgba(94,232,155,.12);color:#5ee89b;font-size:11px;white-space:nowrap}
.offer-facts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.offer-fact{background:rgba(255,255,255,.035);border-radius:8px;padding:7px;font-size:11px;color:#9fc9b3}
.offer-fact b{display:block;color:#e6f5ec;font-size:12px;margin-top:3px}
.nego-rounds{display:flex;gap:7px;margin:10px 0}
.nego-round{flex:1;text-align:center;border:1px solid rgba(94,232,155,.15);border-radius:8px;padding:7px 2px;color:#8fb8a4;font-size:11px}
.nego-round.active{border-color:#e8c05e;color:#e8c05e;background:rgba(232,192,94,.08)}
.nego-form{display:grid;gap:9px;margin-top:10px}
.nego-label{font-size:12px;color:#9fc9b3}
.nego-counter{background:rgba(94,180,232,.08);border:1px solid rgba(94,180,232,.28);border-radius:12px;padding:12px;margin-top:10px}
.nego-counter b{color:#79c9f0}
.nego-result{background:rgba(94,232,155,.08);border:1px solid rgba(94,232,155,.25);padding:12px;border-radius:12px;margin:10px 0;line-height:1.6}
/* مركز المباراة التفاعلي */
.live-score-head{position:relative;overflow:hidden;border:1px solid rgba(94,232,155,.24);border-radius:17px;padding:15px;background:linear-gradient(145deg,rgba(23,91,56,.55),rgba(3,20,12,.88));}
.live-score-head:after{content:'⚽';position:absolute;left:17px;top:40%;font-size:42px;opacity:.16}
.live-minute{font-size:12px;color:#e8c05e;font-weight:800}
.live-scoreboard{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:9px;margin:12px 0 8px;padding:10px 11px;border:1px solid rgba(255,255,255,.13);border-radius:12px;background:rgba(0,0,0,.25);text-align:center}
.live-scoreboard span{font-size:12px;color:#c3d9cb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-scoreboard strong{font-size:25px;color:#fff;letter-spacing:2px;min-width:78px}
.live-ticker{border-right:3px solid #5ee89b;padding:7px 10px;margin-top:6px;background:rgba(94,232,155,.06);border-radius:7px;color:#c5e1d0;font-size:11px;line-height:1.55}
.live-ticker.goal{border-color:#e8c05e;background:rgba(232,192,94,.08);color:#f2dfa0}
.live-final{display:flex;align-items:center;justify-content:center;gap:8px;color:#e8c05e;font-size:13px;font-weight:800;margin:10px 0}

.live-title{font-size:20px;color:#5ee89b;margin:7px 0}
.live-copy{font-size:13px;color:#bdd4c5;line-height:1.7}
.live-pitch{position:relative;min-height:92px;margin-top:13px;border:1px solid rgba(255,255,255,.26);border-radius:12px;background:repeating-linear-gradient(0deg,rgba(94,232,155,.06) 0,rgba(94,232,155,.06) 23px,rgba(94,232,155,.11) 24px,rgba(94,232,155,.11) 47px),linear-gradient(90deg,#123a25,#1a5535);overflow:hidden}
.live-pitch:before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.22)}
.live-pitch:after{content:'';position:absolute;width:52px;height:52px;border:1px solid rgba(255,255,255,.22);border-radius:50%;left:calc(50% - 26px);top:19px}
.live-pitch-ball{position:absolute;z-index:1;top:37px;font-size:19px;transition:right .35s ease;filter:drop-shadow(0 2px 3px #000)}
.live-progress{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:13px 0}
.live-progress i{display:block;height:5px;border-radius:9px;background:rgba(255,255,255,.12)}
.live-progress i.done{background:linear-gradient(90deg,#17b867,#5ee89b)}
.live-progress i.now{background:#e8c05e;box-shadow:0 0 12px rgba(232,192,94,.5)}
.live-choice{width:100%;text-align:right;min-height:62px;padding:11px 13px;margin-top:7px;border:1px solid rgba(94,232,155,.2);border-radius:12px;background:rgba(255,255,255,.035);color:#e6f5ec;cursor:pointer}
.live-choice b{display:block;color:#5ee89b;font-size:14px;margin-bottom:4px}
.live-choice span{font-size:11px;color:#9fc9b3;line-height:1.5}
.live-choice:hover{background:rgba(94,232,155,.10);border-color:#5ee89b}
.live-choice:active{transform:scale(.99)}
.live-metric{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.live-metric .stat b{font-size:15px}
.live-comment{border-right:3px solid #e8c05e;padding:8px 10px;margin-top:8px;background:rgba(232,192,94,.07);border-radius:8px;color:#e9dba7;font-size:12px;line-height:1.55}
.highlight-list{margin:10px 0}
.highlight{display:grid;grid-template-columns:48px 24px 1fr;gap:7px;align-items:center;border-bottom:1px solid rgba(255,255,255,.06);padding:8px 1px;font-size:12px}
.highlight time{color:#e8c05e;font-weight:700}
.highlight b{color:#5ee89b}
@keyframes liveIn{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.live-enter{animation:liveIn .25s ease-out}
@media(max-width:380px){.live-score-head{padding:12px}.live-title{font-size:18px}.live-choice{min-height:68px}}

@media(max-width:380px){.offer-facts{grid-template-columns:1fr 1fr}}


/* تحديث الهوية البصرية الفاخرة — واجهة مسيرة لاعب */
:root{color-scheme:dark;--bg:#050b16;--panel:#08182a;--line:rgba(104,177,255,.2);--blue:#1769ff;--mint:#35e0b0;--gold:#e9bd58;--muted:#9bb2cc}
body{background:radial-gradient(ellipse at 10% 0%,#12365b 0,transparent 35%),radial-gradient(ellipse at 90% 18%,#101d42 0,transparent 36%),linear-gradient(145deg,#030711,#071528 55%,#040a13);color:#f3f7ff;padding:clamp(8px,2vw,22px);background-attachment:fixed}
#app{max-width:980px;padding-bottom:60px}
.card{background:linear-gradient(145deg,rgba(12,31,54,.96),rgba(4,13,26,.96));border:1px solid var(--line);border-radius:20px;padding:clamp(13px,2vw,20px);box-shadow:0 12px 35px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.035);backdrop-filter:blur(12px);animation:panelIn .28s ease both}
@keyframes panelIn{from{opacity:.55;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
h1{color:#f5f8ff;font-size:clamp(20px,3vw,29px);letter-spacing:-.3px}h2,h3{color:#b9d7ff} .sub,label,.row span:first-child,th{color:var(--muted)}
input,select,textarea{background:#071426;border-color:#244668;color:#f5f8ff;border-radius:12px}input:focus,select:focus{border-color:#4188ff;box-shadow:0 0 0 3px #1769ff25}
button{background:linear-gradient(120deg,#2879ff,#0749d8);color:white;border-radius:13px;box-shadow:0 5px 16px #0753db2a;transition:transform .18s,filter .18s,box-shadow .18s}button:hover{filter:brightness(1.12);box-shadow:0 7px 22px #0753db40}button:active{transform:scale(.975)}button.ghost{background:linear-gradient(145deg,#132943,#0b1b30);color:#dceaff;border-color:#2a4b70;box-shadow:none}button.warn,button.gold{background:linear-gradient(120deg,#f4d77b,#c48b26);color:#211600}

function calcSalary(clubStr,ovr,age){
  const base=(clubStr-50)*(clubStr-50)*20;
  const ovrBonus=(ovr-60)*800;
  const ageF=age<21?1.15:age<28?1.0:age<32?0.9:0.75;
  return Math.max(2000,Math.round((base+ovrBonus)*ageF/1000)*1000);
}
function calcMarketValue(ovr,age,goals,assists,recentRating,prestige=0){
  if(ovr<60)return 500000;
  const base=Math.pow(Math.max(0,ovr-55),3.0)*150;
  let ageF;
  if(age<=21)ageF=1.6;else if(age<=24)ageF=1.4;else if(age<=27)ageF=1.15;
  else if(age<=30)ageF=0.9;else if(age<=33)ageF=0.55;else ageF=0.3;
  const perfF=1+(goals*0.02)+(assists*0.015);
  const ratingF=1+Math.max(0,(recentRating-6.5))*0.15;
  const prestigeF=1+Math.min(0.75,Math.max(0,Number(prestige)||0)*0.02);
  return Math.max(500000,Math.round(base*ageF*perfF*ratingF*prestigeF/50000)*50000);
}
function ovrChangeForAge(age){
  if(age<=24)return randInt(2,5);
  if(age<=28)return randInt(0,2);
  if(age<=31)return randInt(-2,0);
  if(age<=35)return randInt(-4,-1);
  return randInt(-6,-2);
}
function getDerbyRival(clubName, leagueId){
  const pairs=DERBIES[leagueId]||[];
  for(const [a,b] of pairs){
    if(a===clubName)return b;
    if(b===clubName)return a;
  }
  return null;
}

function generateFixtures(clubs){
  const n=clubs.length;const rounds=[];const arr=[...clubs];
  for(let r=0;r<n-1;r++){
    const round=[];
    for(let i=0;i<n/2;i++)round.push([arr[i].n,arr[n-1-i].n]);
    rounds.push(round);
    const last=arr.pop();arr.splice(1,0,last);
  }
  const second=rounds.map(r=>r.map(m=>[m[1],m[0]]));
  return [...rounds,...second];
}
function initLeague(id){
  const clubs=LEAGUES[id].clubs;
  const table=clubs.map(c=>({name:c.n,str:c.s,played:0,won:0,drawn:0,lost:0,gf:0,ga:0,pts:0}));
  const fixtures=generateFixtures(clubs);
  return {id,table,fixtures,round:0};
}
function sortTable(){G.league.table.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);}
function updateTable(name,scored,conceded){
  const t=G.league.table.find(x=>x.name===name);if(!t)return;
  t.played++;t.gf+=scored;t.ga+=conceded;
  if(scored>conceded){t.won++;t.pts+=3;}
  else if(scored===conceded){t.drawn++;t.pts++;}
  else t.lost++;
}
function simOtherMatch(strA,strB){
  const diff=(strA-strB)/12;
  const a=Math.max(0,Math.round(rnd(0.7,1.9)+diff*0.35));
  const b=Math.max(0,Math.round(rnd(0.7,1.9)-diff*0.35));
  return [a,b];
}
function simulateLeagueRound(){
  const fixtures=G.league.fixtures[G.league.round];
  if(!fixtures)return;
  fixtures.forEach(([a,b])=>{
    if(a===G.clubName||b===G.clubName)return;
    const cA=LEAGUES[G.league.id].clubs.find(c=>c.n===a);
    const cB=LEAGUES[G.league.id].clubs.find(c=>c.n===b);
    if(!cA||!cB)return;
    const [ga,gb]=simOtherMatch(worldEffectiveStrength(G.league.id,a,cA.s),worldEffectiveStrength(G.league.id,b,cB.s));
    updateTable(a,ga,gb);updateTable(b,gb,ga);
  });
  G.league.round++;
  simulateScorersRound();
}

// أثناء الأكاديمية يستمر الدوري في العالم حتى لو لم يكن اللاعب مرتبطًا بنادٍ محترف.
function simulateAcademyLeagueRound(){
  if(!G||!G.academyPhase)return;
  ensureWorld();
  if(!G.world.leagueTables)G.world.leagueTables={};
  Object.entries(LEAGUES).forEach(([leagueId,league])=>{
    let state;
    if(leagueId===G.leagueId){
      if(!G.league||!Array.isArray(G.league.fixtures))G.league=initLeague(leagueId);
      state=G.league;
    }else{
      if(!G.world.leagueTables[leagueId]){
        const fresh=initLeague(leagueId);
        G.world.leagueTables[leagueId]={table:fresh.table,fixtures:fresh.fixtures,round:0,season:1};
      }
      state=G.world.leagueTables[leagueId];
    }
    if(!Array.isArray(state.fixtures)||!state.fixtures.length)state.fixtures=generateFixtures(league.clubs);
    if(!Array.isArray(state.table)||!state.table.length)state.table=league.clubs.map(c=>({name:c.n,str:worldStrength(leagueId,c.n,c.s),played:0,won:0,drawn:0,lost:0,gf:0,ga:0,pts:0}));
    if(state.round>=state.fixtures.length){
      state.round=0;
      state.season=(state.season||1)+1;
      state.table=league.clubs.map(c=>({name:c.n,str:worldStrength(leagueId,c.n,c.s),played:0,won:0,drawn:0,lost:0,gf:0,ga:0,pts:0}));
    }
    const fixtures=state.fixtures[state.round];
    if(!fixtures)return;
    fixtures.forEach(([a,b])=>{
      const ca=league.clubs.find(c=>c.n===a),cb=league.clubs.find(c=>c.n===b);
      if(!ca||!cb)return;
      const [ga,gb]=simOtherMatch(worldEffectiveStrength(leagueId,a,ca.s),worldEffectiveStrength(leagueId,b,cb.s));
      const apply=(name,scored,conceded)=>{
        const t=state.table.find(x=>x.name===name);if(!t)return;
        t.played++;t.gf+=scored;t.ga+=conceded;
        if(scored>conceded){t.won++;t.pts+=3;}else if(scored===conceded){t.drawn++;t.pts++;}else t.lost++;
      };
      apply(a,ga,gb);apply(b,gb,ga);
      if(leagueId!==G.leagueId){
        (G.world.competitors||[]).forEach(p=>{
          if(p.leagueId!==leagueId||p.status!=='نشط')return;
          if(p.club===a&&ga>0&&chance(Math.min(.45,ga*.08))) {p.goals++;p.careerGoals++;}
          if(p.club===b&&gb>0&&chance(Math.min(.45,gb*.08))) {p.goals++;p.careerGoals++;}
        });
      }
    });
    state.round++;
    state.table.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
    if(leagueId===G.leagueId)simulateScorersRound();
  });
}

function formModifier(){
  if(G.form>=80)return 1.05;
  if(G.form>=60)return 1.0;

function determineLineup(){
  ensureCareerSystems();
  const rel=G.coachRelation||0, fatigue=G.fatigue||0;
  const coachFit=G.coach?.preferredPositions?.includes(G.pos)?4:-3;
  const fitnessPenalty=fatigue>=75?10:fatigue>=50?5:0;
  const effective=G.overall+coachFit+((G.form||50)-50)*0.08-fitnessPenalty;
  if(G.energy<18||G.health<20)return 'out';
  const requestBonus=G.flags?.requestedMoreMinutes?2:0;
  const roleBonus=G.squadRole==='نجم الفريق'?12:G.squadRole==='أساسي'?8:G.squadRole==='لاعب تدوير'?3:0;
  if(rel<20&&effective<88)return 'out';
  if(rel<35&&effective<82)return 'bench';
  if(effective+requestBonus+roleBonus>=82&&G.form>=45)return 'starter';
  if(effective+requestBonus+roleBonus>=74&&G.form>=58)return 'starter';
  if(effective+requestBonus+roleBonus>=68)return 'bench';
  if(effective+requestBonus+roleBonus>=58)return 'bench';
  return 'out';
}
function lineupSalaryFactor(){
  if(G.lineupStatus==='starter')return 1.0;
  if(G.lineupStatus==='bench')return 0.7;
  return 0.5;
}
function baseUpdateCoachRelation(rating){
  if(rating>=8)G.coachRelation=clamp(G.coachRelation+5,0,100);
  else if(rating>=7)G.coachRelation=clamp(G.coachRelation+2,0,100);
  else if(rating<5)G.coachRelation=clamp(G.coachRelation-4,0,100);
  else if(rating<6)G.coachRelation=clamp(G.coachRelation-2,0,100);
  if(G.coach)G.coach.trust=G.coachRelation;
}

function generateMatchStats(goals,assists,rating,minutes){
  const factor=minutes/90;
  let shots=randInt(0,4)+goals*2;
  let passes=randInt(15,55);
  let dribbles=randInt(0,5);
  let tackles=randInt(0,3);
  let fouls=randInt(0,2);
  if(G.pos==='مهاجم'){shots+=3;dribbles+=2;tackles=Math.max(0,tackles-2);}
  else if(G.pos==='جناح'){shots+=2;dribbles+=3;}
  else if(G.pos==='وسط'){passes+=20;tackles+=2;}
  else if(G.pos==='مدافع'){tackles+=4;fouls+=2;passes+=10;}
  const rF=clamp((rating-6)/4,-0.75,1);
  shots=Math.max(0,Math.round(shots*(1+rF*0.3)*factor));
  passes=Math.max(0,Math.round(passes*(1+rF*0.2)*factor));
  dribbles=Math.max(0,Math.round(dribbles*(1+rF*0.4)*factor));
  tackles=Math.max(0,Math.round(tackles*(1+rF*0.2)*factor));
  fouls=Math.max(0,Math.round(fouls*factor));
  let yellow=0,red=0;
  if(Math.random()<fouls*0.18)yellow=1;
  if(yellow&&Math.random()<0.05)red=1;
  return {shots,passes,dribbles,tackles,fouls,yellow,red,minutes};
}

function buildSchedule(){
  const items=[];
  for(let i=0;i<34;i++)items.push({pos:i*1.6+1,type:'league',round:i});
  [7,17,27,37,47].forEach((p,i)=>items.push({pos:p,type:'cup',round:i+1}));
  [12,22,32,42,50,54,58,62].forEach((p,i)=>items.push({pos:p,type:'cont',round:i+1}));
  items.sort((a,b)=>a.pos-b.pos);
  return items.map(x=>({type:x.type,round:x.round}));
}

        potential:randInt(74,91),developmentXP:0,trainingEnvironment:Number((0.78+Math.random()*0.44).toFixed(2)),professionalism:randInt(45,95),
        goals:0,assists:0,matches:0,careerGoals:0,careerAssists:0,trophies:0,form:randInt(40,75),

    const pos=String(p.position||'');

function notify(msg){
  if(G)G.notification={msg,t:Date.now()};
  const host=document.body;if(!host)return;
  const active=Array.from(document.querySelectorAll('.notif'));
  if(active.length>=3)active[0].remove();
  const remaining=Array.from(document.querySelectorAll('.notif'));
  const el=document.createElement('div');el.className='notif';el.textContent=String(msg??'');
  el.style.top=(10+remaining.length*52)+'px';
  host.appendChild(el);
  setTimeout(()=>el.remove(),3200);
}

  const opp=choice(pool);
  return{name:opp.n,str:opp.s,leagueId:opp.leagueId||'continental'};
}

/* ============================================================
   المباراة
   ============================================================ */
function basePlayMatch(){
  if(G.retired)return;
  const m=G.schedule[G.turnIndex];
  if(!m){endSeason();return;}
  if(G.injury){advanceWeekSkip();return;}
  processWeeklyRoutine();
  simulateWorldWeek();

  let opp;
  if(G._liveMatchOpponent){opp={...G._liveMatchOpponent};G._liveMatchOpponent=null;}
  else if(m.type==='league'){
    opp=pickLeagueOpponent();
    if(!opp){advanceTurn();return;}
    const c=LEAGUES[G.league.id].clubs.find(x=>x.n===opp.name);
    opp={...opp,str:worldEffectiveStrength(G.leagueId,opp.name,c?c.s:65)};
  }else if(m.type==='cup'){
    if(G.cup.eliminated){advanceTurn();return;}
    opp=randomCupOpponent();
  }else{
    if(!G.cont.active||G.cont.eliminated){advanceTurn();return;}
    opp=randomContOpponent();
  }

  // تحديث الخط
  G.lineupStatus=determineLineup();
  if(G.flags)G.flags.requestedMoreMinutes=false;
  const isDerby=m.type==='league'&&opp.name===G.derbyOpponent;
  G.derbyActive=isDerby;

  // خارج التشكيلة: يمر أسبوع بدون لعب
  if(G.lineupStatus==='out'){
    if(m.type==='league'){
      simulateLeagueRound();
      // simulate league round but player didn't play
      updateTableOnOut(opp);
    }
    G.health=clamp(G.health+3,0,100);
    G.energy=clamp(G.energy+10,0,100);
    G._currentMatchPlan=null;
    G.turnIndex++;
    notify('💺 خارج التشكيلة — لم تلعب');
    checkSeasonEnd();
    save();render();
    return;
  }

  const lifeBonus=PERSONALITIES.lifestyle[G.personality.lifestyle].healthBonus;
  const effFactor=clamp(0.6+(G.energy/100)*0.25+((G.health+lifeBonus)/100)*0.15-((G.fatigue||0)/100)*0.22,0.35,1.05);
  const p=POSITIONS[G.pos];
  const planKey=G._currentMatchPlan||'balanced';
  const planGoalBonus=planKey==='attack'?0.06:planKey==='defend'?-0.025:planKey==='counter'?0.02:0;
  const planAssistBonus=planKey==='counter'?0.035:planKey==='defend'?0.015:planKey==='attack'?-0.015:0;
  const liveBonus=G._matchDecisionBonus||{};
  const livePlayerScale=G.lineupStatus==='starter'?1:0.45;
  const skill=((G.overall-60)/100)*effFactor;
  const minutes=G.lineupStatus==='starter'?90:randInt(15,30);
  const minuteF=minutes/90;
  const chances=Math.max(1,Math.round(randInt(p.chances[0],p.chances[1])*minuteF));

  const liveOutcome=G._liveMatchOutcome||null;
  let goals=liveOutcome?Number(liveOutcome.playerGoals)||0:0,assists=liveOutcome?Number(liveOutcome.assists)||0:0;
  const styleGoalBonus=((G.playerPersonality?.selfishness||30)-50)/1000;
  const styleAssistBonus=((G.playerPersonality?.teamwork||50)-50)/1000;
  if(!liveOutcome){for(let i=0;i<chances;i++){
    if(Math.random()<clamp(p.goals+skill*0.65*formModifier()+styleGoalBonus+planGoalBonus+(liveBonus.goal||0)*livePlayerScale,0.02,0.9))goals++;
    else if(Math.random()<clamp(p.assists+skill*0.55+styleAssistBonus+planAssistBonus+(liveBonus.assist||0)*livePlayerScale,0.02,0.9))assists++;
  }}

  const tacticalBonus=G.coach?.style?.includes('استحواذ')&&['وسط','جناح'].includes(G.pos)?1.5:G.coach?.style?.includes('هجمات')&&['مهاجم','جناح'].includes(G.pos)?1.8:G.coach?.style?.includes('ضغط')&&G.energy>50?1.2:0;
  const planTeamBonus=planKey==='attack'?1.5:planKey==='defend'?-1:planKey==='counter'?(opp.str>G.clubStrength?2.5:1):0;
  const myStr=worldEffectiveStrength(G.leagueId,G.clubName,G.clubStrength)+(G.overall-60)*0.6+tacticalBonus+planTeamBonus+clamp(liveBonus.team||0,-2,2)+coachLineupStrengthBonus();
  const diff=myStr-opp.str;
  const others=clamp(Math.round(rnd(-0.3,1.8)+diff/40),0,5);
  let myGoals=liveOutcome?Number(liveOutcome.myGoals)||0:goals+others;
  let oppGoals=liveOutcome?Number(liveOutcome.oppGoals)||0:clamp(Math.round(rnd(0,2)-diff/45-clamp(liveBonus.defense||0,-1,1)),0,6);
  if(!liveOutcome&&planKey==='defend'&&chance(.48))oppGoals=Math.max(0,oppGoals-1);
  if(!liveOutcome&&planKey==='attack'&&chance(.25))oppGoals=Math.min(6,oppGoals+1);

  let rating=6.0+goals*0.9+assists*0.6+rnd(-0.6,0.7);
  if(myGoals>oppGoals)rating+=0.4;else if(myGoals<oppGoals)rating-=0.4;
  if(isDerby)rating+=0.5;
  rating+=clamp(liveBonus.rating||0,-0.5,0.65);
  rating=clamp(rating,3.0,10.0);
  rating=Math.round(rating*10)/10;
  const motm=rating>=8.5;

  // تحديث الإحصائيات الأساسية
  G.totalMatches++;G.seasonMatches++;
  G.totalGoals+=goals;G.seasonGoals+=goals;
  G.totalAssists+=assists;G.seasonAssists+=assists;
  if(motm){G.totalMotm++;G.seasonMotm++;G.monthlyMotm=(G.monthlyMotm||0)+1;}
  G.ratingSum+=rating;
  G.careerRatingSum=(G.careerRatingSum||0)+rating;G.careerRatingCount=(G.careerRatingCount||0)+1;

  // إحصائيات دقيقة
  const mStats=generateMatchStats(goals,assists,rating,minutes);
  const decisionActions=G._matchActionStats||{};
  ['shots','passes','dribbles','tackles'].forEach(k=>mStats[k]=(mStats[k]||0)+(decisionActions[k]||0));
  G.lastMatchStats=mStats;
  Object.keys(G.careerMatchStats).forEach(k=>{G.careerMatchStats[k]=(G.careerMatchStats[k]||0)+(mStats[k]||0);});

  // خريطة الحرارة
  updateHeatMap(minutes);

  // clubStats
  if(!G.clubStats[G.clubName])G.clubStats[G.clubName]={matches:0,goals:0,assists:0,ratingSum:0,years:'',trophies:[]};
  const cs=G.clubStats[G.clubName];
  cs.matches++;cs.goals+=goals;cs.assists+=assists;cs.ratingSum+=rating;

  // صحة ولياقة
  const healthDrop=Math.round((randInt(2,5)+(myGoals<oppGoals?1:0))*(minutes/90));
  G.health=clamp(G.health-healthDrop,0,100);
  G.energy=clamp(Math.round(G.energy-randInt(10,25)*(minutes/90)),0,100);

  // فورمة وعلاقة مدرب
  updateForm(rating);
  updateCoachRelation(rating,goals,assists,minutes,mStats);

  // الشهرة
  const moralF=PERSONALITIES.moral[G.personality.moral].fameM;
  let fameAdd=Math.round((rating-6)*moralF*(minutes/90));
  if(isDerby&&myGoals>oppGoals)fameAdd*=2;
  G.fame=clamp(G.fame+fameAdd,0,100);
  if(motm)G.fame=clamp(G.fame+3,0,100);
  G.followers=Math.max(G.followers||0,Math.round(G.fame*10000+G.fame*G.fame*500));
  if(isDerby)G.followers=Math.round(G.followers*1.05);
  updateSocial();

  // مكافآت ديربي
  if(isDerby){
    G.money+=200000;
    G.financialLog.unshift({t:'income',m:200000,d:'مكافأة ديربي'});
  }

  // هاتريك
  if(goals>=3)G._hattrickFlag=1;
  if(isDerby&&goals>0){G._derbyGoalFlag=1;G.reputation=clamp(G.reputation+5,0,100);if(!G.flags.derbyGoal)G.flags.derbyGoal=true;}

  // streak
  if(goals>0)G._goalStreak=(G._goalStreak||0)+1;else G._goalStreak=0;
  if(myGoals>oppGoals){G._winStreak=(G._winStreak||0)+1;G._noLossStreak=(G._noLossStreak||0)+1;G._unbeatenStreak=(G._unbeatenStreak||0)+1;}
  else if(myGoals===oppGoals){G._winStreak=0;G._noLossStreak=(G._noLossStreak||0)+1;G._unbeatenStreak=(G._unbeatenStreak||0)+1;}
  else{G._winStreak=0;G._noLossStreak=0;G._unbeatenStreak=0;}
  if(rating>=8.5)G._highRatingCount=(G._highRatingCount||0)+1;

  // كأس / قاري
  if(m.type==='cup'&&myGoals>oppGoals){
    G.cup.round++;
    if(G.cup.round>=5){
      G.cup.trophy=true;
      G.trophies.push(`كأس ${LEAGUES[G.leagueId].cupName} (م${G.season})`);
      G.money+=500000;G.fame+=10;G.flags.cupWon=true;
      G.financialLog.unshift({t:'reward',m:500000,d:'كأس'});
      if(goals>=3)G.flags.hattrickFinal=true;
    }
  }else if(m.type==='cup'&&myGoals<oppGoals)G.cup.eliminated=true;

  if(m.type==='cont'&&myGoals>oppGoals){
    G.cont.round++;
    if(G.cont.round>=8){
      G.cont.trophy=true;
      const isEu=LEAGUES[G.leagueId].region==='europe';
      G.trophies.push(`${LEAGUES[G.leagueId].contName} (م${G.season})`);
      G.money+=2000000;G.fame+=15;
      if(isEu)G.flags.uclWon=true;else G.flags.asianWon=true;
      G.financialLog.unshift({t:'reward',m:2000000,d:'بطولة قارية'});
    }
  }else if(m.type==='cont'&&myGoals<oppGoals)G.cont.eliminated=true;

  if(m.type==='league'&&opp){
    updateTable(G.clubName,myGoals,oppGoals);
    updateTable(opp.name,oppGoals,myGoals);
    simulateLeagueRound();
  }

  // تقدم الشهرية
  G.monthly.matches++;G.monthly.ratingSum+=rating;
  if(G.monthly.matches>=4)checkPlayerOfMonth();

  G.lastMatchRating=rating;
  G.playerMorale=clamp((G.playerMorale||68)+(rating>=8?5:rating>=7?2:rating<5.5?-5:-1)+(goals>0?3:0),0,100);G.confidence=clamp((G.confidence||60)+(rating>=7.5?3:rating<5.5?-3:0)+(goals>0?2:0),0,100);G.clubSpirit=clamp((G.clubSpirit||65)+(rating>=7.5?1:-1),0,100);
  G.lastReport={
    type:m.type,round:m.round,opp:opp.name,home:opp.home!==false,
    myGoals,oppGoals,goals,assists,rating,motm,clubName:G.clubName,development:G.lastDevelopmentMessage||'',
    isDerby,lineup:G.lineupStatus,stats:mStats,plan:planKey
  };
  G._currentMatchPlan=null;
  G.lastReport.liveDecisions=G._matchDecisionLog||[];
  G.lastReport.liveTimeline=liveOutcome?.timeline||[];
  G.lastReport.momentum=clamp(50+Math.round((liveBonus.team||0)*12+(liveBonus.rating||0)*18),0,100);
  G._matchDecisionBonus=null;G._matchActionStats=null;G._matchDecisionLog=null;G._liveMatchOutcome=null;
  addPhoneNews('⚽ نتيجة مباراة',`${G.clubName} ${myGoals} - ${oppGoals} ${opp.name}. تقييمك ${rating}/10، أهدافك ${goals} وصناعتك ${assists}.`);
  G.log.unshift({opp:opp.name,my:myGoals,oppG:oppGoals,goals,assists,rating,type:m.type,isDerby});
  if(G.log.length>12)G.log.pop();

  // راتب
  if(G.totalMatches%4===0){
    const wage=Math.round(G.salary*4*lineupSalaryFactor());
    G.money+=wage;
    G.financialLog.unshift({t:'income',m:wage,d:'راتب'});
  }

  // التطور الدائم يتم عبر نقاط التطوير والمهارات، وليس قفزات مباشرة في التقييم العام.

  // تكلفة الجهد البدني بعد المباراة
  G.energy=clamp(G.energy-(G.lineupStatus==='starter'?10:5)-clamp(liveBonus.energy||0,-2,5),0,100);
  G.fatigue=clamp((G.fatigue||0)+(G.lineupStatus==='starter'?7:3)+Math.max(0,liveBonus.energy||0)*.25,0,100);
  awardMatchDevelopment(rating,goals,assists,mStats);
  if(G.lastReport)G.lastReport.development=G.lastDevelopmentMessage;
  // إصابة
  checkInjury(rating,isDerby);

  // تحديات
  checkChallenges();

  // milestones
  checkMilestones();

  // أحداث
  if(G.totalMatches%6===0&&!G.pendingEvent&&chance(0.5))triggerRandomEvent();

  // عرض انتقال
  if(G.totalMatches%8===0&&!G.offer&&isTransferWindow()){
    const offer=makeOffer();
    if(offer)G.offer=offer;
  }

  G.turnIndex++;
  checkAchievements();
  screen='match';
  save();
  render();
}

function updateTableOnOut(opp){
  // player's team plays but player doesn't
  const t=G.academyPhase?null:G.league.table.find(x=>x.name===G.clubName);
  if(!t)return;
  const myStr=G.clubStrength;
  const [my,op]=simOtherMatch(myStr,opp.str);
  updateTable(G.clubName,my,op);
  updateTable(opp.name,op,my);
}

function updateHeatMap(minutes){
  const f=minutes/90;
  if(G.pos==='مهاجم'){
    G.heatMap.attacking+=(5*f);
    G.heatMap.middle+=(2*f);
    G.heatMap.defensive+=(0.5*f);
  }else if(G.pos==='جناح'){
    G.heatMap.attacking+=(4*f);
    G.heatMap.middle+=(3*f);
    G.heatMap.defensive+=(1*f);
  }else if(G.pos==='وسط'){
    G.heatMap.attacking+=(2.5*f);
    G.heatMap.middle+=(5*f);
    G.heatMap.defensive+=(2.5*f);
  }else{
    G.heatMap.attacking+=(1*f);
    G.heatMap.middle+=(3*f);
    G.heatMap.defensive+=(5*f);
  }
}

function updateSocial(){
  const f=G.followers;
  G.social.insta=Math.round(f*0.55);
  G.social.tiktok=Math.round(f*0.30);
  G.social.twitter=Math.round(f*0.10);
  G.social.youtube=Math.round(f*0.05);
}

function checkPlayerOfMonth(){
  if(G.monthly.matches<3)return;
  const avg=G.monthly.ratingSum/G.monthly.matches;
  if(avg>=7.5){
    G.reputation=clamp(G.reputation+5,0,100);
    G.fame=clamp(G.fame+3,0,100);
    G.money+=100000;
    G.awards.push(`🌟 لاعب الشهر ${G.monthly.month} - موسم ${G.season}`);
    G.financialLog.unshift({t:'reward',m:100000,d:'لاعب الشهر'});
    G.flags.playerOfMonth=true;
    notify('🌟 فزت بلاعب الشهر!');
  }
  G.monthly={matches:0,ratingSum:0,month:(G.monthly.month||1)+1};
  G.monthlyMotm=0;
}

function checkInjury(rating,isDerby){
  const lifeBonus=PERSONALITIES.lifestyle[G.personality.lifestyle].healthBonus;
  const h=G.health+lifeBonus;
  const ageF=G.age>=30?1.4:G.age>=27?1.15:1.0;
  const healthF=h<30?2.2:h<50?1.4:1.0;
  let p=0.15*ageF*healthF;
  if(rating<5.5)p*=1.2;
  if(isDerby)p*=1.1;
  if(Math.random()<p){
    const r=Math.random();
    let weeks,desc;
    if(r<0.5){weeks=randInt(1,3);desc='إلتواء خفيف';}
    else if(r<0.8){weeks=randInt(4,8);desc='إصابة عضلية';}
    else if(r<0.95){weeks=randInt(12,32);desc='إصابة في الرباط';}
    else{weeks=randInt(36,50);desc='إصابة خطيرة';}
    G.injury=desc;G.injuryWeeks=weeks;
    G.health=clamp(G.health-20,0,100);
    if(weeks>8&&!G.milestonesSeen.includes('serious_injury')){
      G.milestonesSeen.push('serious_injury');
      G.pendingMilestone='serious_injury';
    }
  }
}

function checkMilestones(){
  if(G.totalGoals>=1&&!G.milestonesSeen.includes('first_goal')){
    G.milestonesSeen.push('first_goal');G.pendingMilestone='first_goal';
  }else if(G.trophies.length>=1&&!G.milestonesSeen.includes('first_trophy')){
    G.milestonesSeen.push('first_trophy');G.pendingMilestone='first_trophy';
  }else if(G.national&&!G.milestonesSeen.includes('first_callup')){
    G.milestonesSeen.push('first_callup');G.pendingMilestone='first_callup';
  }else if(G.ballonDors>=1&&!G.milestonesSeen.includes('first_ballon')){
    G.milestonesSeen.push('first_ballon');G.pendingMilestone='first_ballon';
  }
}

function checkChallenges(){
  if(!Array.isArray(G.challengeWins))G.challengeWins=[];
  const won=new Set(G.challengeWins);
  let index=Math.max(0,Number(G.currentChallenge)||0);
  while(index<CHALLENGES.length&&won.has(CHALLENGES[index].id))index++;
  G.currentChallenge=index;
  const c=CHALLENGES[index];
  if(!c)return;
  const val=G[c.field]||0;
  if(val>=c.target){
    G.money+=c.reward;
    if(!won.has(c.id))G.challengeWins.push(c.id);
    G.financialLog.unshift({t:'income',m:c.reward,d:`تحدي: ${c.n}`});
    notify(`🎯 أكملت: ${c.n} (+${fmt(c.reward)})`);
    if(c.field.startsWith('_'))G[c.field]=0;
    const updated=new Set(G.challengeWins);
    let next=index+1;while(next<CHALLENGES.length&&updated.has(CHALLENGES[next].id))next++;
    G.currentChallenge=next;
  }
}

function advanceWeekSkip(){
  processWeeklyRoutine();
  simulateWorldWeek();
  const m=G.schedule[G.turnIndex];
  if(m&&m.type==='league'){
    const found=pickLeagueOpponent();
    let injuredOpponent=null;
    if(found){
      const club=LEAGUES[G.league.id].clubs.find(c=>c.n===found.name);
      injuredOpponent={...found,str:worldEffectiveStrength(G.leagueId,found.name,club?club.s:65)};
    }
    simulateLeagueRound();
    if(injuredOpponent)updateTableOnOut(injuredOpponent);
  }
  G.injuryWeeks--;
  if(G.injuryWeeks<=0){
    G.injury=null;
    G.health=clamp(G.health+30,0,100);
    if(!G.flags.seriousInjuryRecovered)G.flags.seriousInjuryRecovered=true;
  }
  G.health=clamp(G.health+2,0,100);
  G.turnIndex++;
  checkAchievements();
  checkSeasonEnd();
  save();render();
}
function advanceTurn(){G.turnIndex++;checkSeasonEnd();save();render();}

function continueAfterMatch(){
  const reportRating=G.lastReport?.rating;
  G.lastReport=null;
  if(G.pendingMilestone){screen='milestone';save();render();return;}
  if(G.pendingEvent){screen='event';save();render();return;}
  if(!G.academyPhase&&G.totalMatches>0&&G.totalMatches%3===0&&G._lastPressMatch!==G.totalMatches){G._lastPressMatch=G.totalMatches;const good=(reportRating||G.ratingSum/Math.max(1,G.seasonMatches))>=7;G.pendingEvent={custom:'press',text:good?'بعد المباراة، يسألك الصحفي عن أدائك الجيد وما إذا كنت مستعدًا للخطوة التالية.':'بعد مباراة لم تكن في أفضل حالاتك، سألك صحفي عن سبب تراجع الأداء. اختر ردك، فالإعلام والجمهور سيتفاعلان مع كلامك.',opts:['رد محترم ودبلوماسي','رد صريح وواثق','رد ساخر','رد غير محترم'],pressOptions:[{fn:()=>{G.reputation=clamp(G.reputation+3,0,100);G.fame=clamp(G.fame+1,0,100);log('أجبت الصحافة بدبلوماسية');}},{fn:()=>{G.reputation=clamp(G.reputation+1,0,100);G.fame=clamp(G.fame+2,0,100);log('أجبت الصحافة بصراحة');}},{fn:()=>{G.reputation=clamp(G.reputation-2,0,100);G.fame=clamp(G.fame+4,0,100);log('رد ساخر في مقابلة صحفية');}},{fn:()=>{G.reputation=clamp(G.reputation-8,0,100);G.coachRelation=clamp(G.coachRelation-4,0,100);G.fame=clamp(G.fame+2,0,100);log('رد غير محترم في مقابلة صحفية');}}]};screen='event';save();render();return;}
  if(G.offer){screen='hub';subTab='main';save();render();return;}
  checkSeasonEnd();
  save();render();
}

function checkSeasonEnd(){
  if(G.turnIndex>=G.schedule.length)endSeason();
  else{screen='hub';subTab='main';}
}

/* ============================================================
   عروض الانتقال
   ============================================================ */
function baseMakeOffer(){
  if(G.academyPhase||G.age<17)return null;
  const allClubs=[];
  LEAGUES.saudi.clubs.forEach(c=>allClubs.push({...c,league:'saudi'}));
  LEAGUES.spain.clubs.forEach(c=>allClubs.push({...c,league:'spain'}));
  LEAGUES.england.clubs.forEach(c=>allClubs.push({...c,league:'england'}));
  ensureWorld();const myStr=G.clubStrength;
  const playerStanding=G.overall+(G.fame||0)*0.10+(G.reputation-50)*0.04+Math.min(5,(G.totalMatches||0)*0.08);
  const maxClubStrength=playerStanding<62?myStr+5:playerStanding<70?myStr+12:playerStanding<78?myStr+20:playerStanding<86?myStr+28:99;
  let pool=allClubs.filter(c=>c.n!==G.clubName&&worldStrength(c.league,c.n,c.s)>=myStr-5&&worldStrength(c.league,c.n,c.s)<=maxClubStrength&&worldStrength(c.league,c.n,c.s)<=playerStanding+12);
  if(pool.length===0)pool=allClubs.filter(c=>c.n!==G.clubName&&worldStrength(c.league,c.n,c.s)<=maxClubStrength&&worldStrength(c.league,c.n,c.s)<=playerStanding+15&&worldStrength(c.league,c.n,c.s)>myStr);
  if(pool.length===0)return null;
  const avg=G.seasonMatches?G.ratingSum/G.seasonMatches:6.5;
  if(G.totalMatches&&avg<6.4&&G.reputation<45)return null;

function baseEndSeason(){
  sortTable();
  const pos=G.league.table.findIndex(t=>t.name===G.clubName)+1;
  const champion=G.league.table[0].name;

    G.financialLog.unshift({t:'reward',m:1000000,d:'بطل الدوري'});

  }

    G.awards.push(`أفضل لاعب ${LEAGUES[G.leagueId].name} - موسم ${G.season}`);

    G.money+=300000;G.fame+=5;
  }
  if(G.seasonMatches>=20&&G.age<=21&&avg>=7.2){
    G.awards.push(`أفضل لاعب شاب - موسم ${G.season}`);
    G.fame+=8;
  }
  let ballonWon=false;
  if(avg>=8.3&&G.seasonGoals>=25&&G.seasonAssists>=10&&G.overall>=88&&G.age<=32){
    G.ballonDors++;
    G.awards.push(`🏆 الكرة الذهبية - موسم ${G.season}`);
    G.fame=100;G.money+=2000000;
    G.financialLog.unshift({t:'reward',m:2000000,d:'الكرة الذهبية'});
    ballonWon=true;
  }

  handleNationalSeason();

  // حساب موسمي
  const seasonData={
    season:G.season,club:G.clubName,pos,
    matches:G.seasonMatches,goals:G.seasonGoals,assists:G.seasonAssists,
    motm:G.seasonMotm,avg:avg.toFixed(2),champion,isChamp
  };
  G.seasonLog.push(seasonData);

  const relegated=G.league.table.slice(-3).map(t=>t.name);
  const isRelegated=relegated.includes(G.clubName);

  // دخل أصول
  let assetIncome=0;
  G.assets.forEach(a=>{
    assetIncome+=a.income||0;
    if(a.variance)a.value=Math.round(a.value*(1+rnd(-a.variance,a.variance)));
    else a.value=Math.round(a.value*(1+(a.growth||0)));
  });
  if(assetIncome>0){
    G.money+=assetIncome;
    G.financialLog.unshift({t:'income',m:assetIncome,d:'دخل الأصول'});
  }
  const socialIncome=Math.round(G.followers/100000*10000);
  if(socialIncome>0){
    G.money+=socialIncome;
    G.financialLog.unshift({t:'income',m:socialIncome,d:'سوشيال'});
  }
  const tax=Math.round(G.salary*40*0.3);
  if(tax>0){
    G.money-=tax;
    G.financialLog.unshift({t:'expense',m:tax,d:'ضرائب'});
  }

  if(G.clubStats[G.clubName]){
    const cs=G.clubStats[G.clubName];
    if(!cs.years)cs.years=`${G.season}`;
    else if(!cs.years.endsWith(`-${G.season}`))cs.years+=`-${G.season}`;
  }

  const offer=makeOffer();

  // تخزين تقرير الموسم قبل إعادة التعيين
  const seasonReport={
    season:G.season,pos,champion,isChamp,isRelegated,
    matches:seasonData.matches,goals:seasonData.goals,assists:seasonData.assists,
    avg:seasonData.avg,offer,ballonWon
  };
  G.lastSeasonAwards={
    season:G.season,
    champion,
    bestPlayer:avg>=7.5&&G.seasonMatches>=20?G.name:choice(FIRST_NAMES)+' '+choice(MID_NAMES),

    bestCoach:choice(FIRST_NAMES)+' '+choice(MID_NAMES),
    ballonWon
  };

  // تحديث عالم الأندية والمنافسين مرة واحدة في نهاية الموسم.
  simulateWorldSeason();
  advanceSquadSeason();
  // نهاية الإعارة: العودة تلقائياً إلى النادي الأصلي بعد إكمال موسم كامل.
  if(G.loan&&G.season+1>=G.loan.endSeason){
    const loan=G.loan;const oldClub=G.clubName;G.clubName=loan.clubName;G.clubStrength=worldStrength(loan.leagueId,loan.clubName,loan.clubStrength);G.leagueId=loan.leagueId;G.salary=loan.salary;G.contractYears=loan.contractYears;G.loan=null;
    worldTransfer(G.name,oldClub,G.clubName,G.leagueId,0,'عودة من الإعارة');worldNews(`↩️ عاد ${G.name} إلى ${G.clubName} بعد انتهاء الإعارة.`);
  }
  // تقدم سريع
  G.season++;G.age++;
  G.health=clamp(G.health+20,0,100);
  G.energy=100;
  G.fatigue=clamp((G.fatigue||0)-25,0,100);
  G.lastRoutineTurn=-1;
  G.form=clamp(Math.round((G.form+50)/2),0,100); // تراجع نحو 50
  // رضا المدرب لا يرتفع ولا ينخفض تلقائياً لمجرد مرور الموسم.

  if(G.age<24&&Math.random()<0.7){const k=choice(Object.keys(G.skills));G.skills[k]=clamp(G.skills[k]+1,35,99);}
  if(G.age>=30){Object.keys(G.skills||{}).forEach(k=>{if(Math.random()<0.25)G.skills[k]=clamp(G.skills[k]-1,35,99);});}
  refreshOverallFromSkills();
  G.overall=clamp(G.overall,40,Math.min(99,G.potential+(G.age>29?5:0)));
  if(G.age>=30)G.potential=Math.max(60,G.potential-1);
  if(G.age>=36)G.potential=Math.max(55,G.potential-2);

  G.marketValue=calcMarketValue(G.overall,G.age,G.seasonGoals,G.seasonAssists,avg,(G.trophies?.length||0)+(G.awards?.length||0)*0.5+(G.ballonDors||0)*3);
  G.releaseClause=G.marketValue*2;
  G.salary=calcSalary(G.clubStrength,G.overall,G.age);

  // حفظ سجل الموسم للاعب والرجوع إليه في بطاقة المسيرة.
  G.careerHistory=G.careerHistory||[];
  G.careerHistory.unshift({season:G.season,club:G.clubName,matches:G.seasonMatches,goals:G.seasonGoals,assists:G.seasonAssists,note:'موسم مكتمل'});
  if(G.careerHistory.length>12)G.careerHistory.length=12;
  // إعادة تعيين موسمية
  G.seasonMatches=0;G.seasonGoals=0;G.seasonAssists=0;G.seasonMotm=0;
  G.ratingSum=0;G.turnIndex=0;G.schedule=buildSchedule();
  G.league=initLeague(G.leagueId);
  G.league.table.forEach(t=>{t.str=worldStrength(G.leagueId,t.name,t.str);});
  const sc=generateLeagueScorers(G.leagueId);
  G.leagueScorers=sc.scorers;G.leagueAssists=sc.assisters;
  G.cup={active:true,round:0,eliminated:false,trophy:false};
  G.cont={active:!isRelegated,round:0,eliminated:false,trophy:false};
  G.trainingDone=false;
  G.monthly={matches:0,ratingSum:0,month:1};
  G.monthlyMotm=0;
  G.derbyOpponent=getDerbyRival(G.clubName,G.leagueId);
  G.careerMatchStats={shots:0,passes:0,dribbles:0,tackles:0,fouls:0,yellow:0,red:0};
  G._goalStreak=0;G._winStreak=0;G._unbeatenStreak=0;G._noLossStreak=0;G._highRatingCount=0;
  G._hattrickFlag=0;G._derbyGoalFlag=0;
  G.contractYears=Math.max(0,(G.contractYears||1)-1);

  checkAchievements();

  if(G.age>=40||(G.overall<50&&G.age>=36)){
    G.retired=true;
    screen='retire';
    save();render();
    return;
  }

  G.seasonEndReport=seasonReport;
  G.pendingEvent=null;
  G.retirementOffered=false;
  screen=G.lastSeasonAwards.ballonWon?'ballondor':'awards';
  save();render();
}

  if(G.national){
    const n=G.national;

  }else if(n.captain&&G.overall<78)n.captain=false;

  const focus=nc.focus;
  const friendlies=randInt(2,3),qualifiers=randInt(2,3);
  let plannedMatches=friendlies+qualifiers;
  const continentalSeason=season%4===0;
  const worldCupSeason=(season+2)%4===0;
  const playChance=n.role==='أساسي'?0.94:n.role==='ضمن التشكيلة'?0.78:n.role==='احتياطي'?0.48:0.25;
  const scoreChance=clamp(0.16+(G.overall-60)*0.006+(focus==='scoring'?0.09:0)+(G.pos==='مهاجم'?0.13:G.pos==='جناح'?0.08:0),0.12,0.72);
  const assistChance=clamp(0.14+(G.overall-60)*0.005+(focus==='playmaking'?0.12:0)+(G.pos==='وسط'?0.13:G.pos==='جناح'?0.07:0),0.1,0.65);
  const played=[];

  if(played.length===0&&chance(playChance))played.push('ودية');

      }

        notify('🏆 حققت بطولة قارية مع المنتخب!');seasonRecord.notes.push('بطل البطولة القارية');
      }else seasonRecord.notes.push('شارك المنتخب في البطولة القارية ولم يحقق اللقب');
      if((tg+ta)>=4&&n.role!=='احتياطي'&&chance(0.25)){nc.internationalAwards++;n.internationalAwards=(n.internationalAwards||0)+1;G.awards.push(`أفضل لاعب في البطولة القارية (م${season})`);G.fame=clamp(G.fame+6,0,100);seasonRecord.notes.push('حصلت على جائزة فردية قارية');}
    }else seasonRecord.notes.push('لم يشارك اللاعب في النهائيات القارية');
  }
  if(worldCupSeason){
    n.tournaments++;seasonRecord.competitions.push('كأس العالم');
    const qualified=G.overall>=72&&chance(clamp(0.25+(G.overall-70)*0.012,0.25,0.62));
    if(qualified&&chance(playChance)){
      nc.worldCupAppearances++;n.worldCupAppearances=(n.worldCupAppearances||0)+1;

        if(chance(assistChance*0.82)){ta++;n.assists++;G.intAssists=(G.intAssists||0)+1;}
        n.matches++;n.caps=(n.caps||0)+1;G.intMatches=(G.intMatches||0)+1;seasonRecord.matches++;
      }
      seasonRecord.goals+=tg;seasonRecord.assists+=ta;
      const wcWinChance=clamp(0.008+(G.overall-75)*0.0018+(G.overall>=92?0.025:0),0.008,0.075);
      if(chance(wcWinChance)){
        n.worldCupTrophy=true;G.trophies.push(`كأس العالم للمنتخبات (م${season})`);G.fame=100;G.reputation=100;G.money+=2500000;

    }else seasonRecord.notes.push('لم يتأهل المنتخب أو لم تدخل قائمة النهائيات');
  }
  // تحديث ملخص المسيرة الدولية مع الاحتفاظ بسجل المواسم.
  n.history=n.history||[];n.history.unshift(seasonRecord);if(n.history.length>12)n.history.length=12;
  nc.history.unshift(seasonRecord);if(nc.history.length>12)nc.history.length=12;nc.lastSeason=season;

}

}

/* ============================================================
   Contract Renewal
   ============================================================ */
function openContractRenewal(){screen='contract';render();}
function contractRenewAction(action){
  ensureBigUpdateState();
  const current=G.salary;
  if(action==='same'){
    G.contractYears=3;
    notify('✍️ جددت بنفس الشروط');
    afterRenewal();
  }else if(action==='negotiate'){
    const avg=G.careerRatingCount?(G.careerRatingSum/G.careerRatingCount):6.5;
    let bump=0;
    if(avg>=7.5)bump=0.3;
    else if(avg>=7)bump=0.15;
    else if(avg>=6.5)bump=0.08;
    else bump=0;
    if(bump===0){
      notify('❌ النادي رفض رفع الراتب');
      afterRenewal();return;
    }
    G.salary=Math.round(current*(1+bump)/1000)*1000;
    G.contractYears=3;
    notify(`✅ وافق النادي (+${Math.round(bump*100)}%)`);
    afterRenewal();
  }else if(action==='reject'){
    G.contractYears=Math.max(1,G.contractYears-1);
    notify('🚪 رفضت التجديد');
    afterRenewal();
  }else if(action==='clause'){
    G.releaseClause=Math.round(G.marketValue*2.5/1000)*1000;
    G.contractYears=3;
    notify('📜 شرط جزائي عالي');
    afterRenewal();
  }
}
function afterRenewal(){
  G.seasonEndReport=G.seasonEndReport||{};
  G.pendingRenewal=false;
  // تابع إلى شاشة نهاية الموسم
  screen='seasonEnd';
  save();render();
}

function getGameDate(){
 const start=new Date(Date.UTC(G?.careerStartYear||2026,(G?.careerStartMonth||7)-1,G?.careerStartDay||1));
 const total=((Math.max(1,G?.season||1)-1)*365)+Math.max(0,G?.turnIndex||0)*7+(G?.currentCalendarDay||0);
 return new Date(start.getTime()+total*86400000);
}
function formatGameDate(){const d=getGameDate();return `${d.getUTCDate()}/${d.getUTCMonth()+1}/${d.getUTCFullYear()}`;}
function isTransferWindow(){if(G?._allowSeasonOffer)return true;const m=getGameDate().getUTCMonth()+1;return [1,6,7,8].includes(m);}
function transferWindowName(){const m=getGameDate().getUTCMonth()+1;return m===1?'نافذة منتصف الموسم':([6,7,8].includes(m)?'نافذة نهاية الموسم':'خارج فترات الانتقالات');}

function publishPhonePost(textOverride){
 ensureBigUpdateState();const input=$('phonePostText');const text=(textOverride||input?.value||'').trim();if(!text){notify('اكتب شيئًا قبل النشر');return;}
  const wk=G.season*1000+(G.turnIndex||0);if(G._postWeek!==wk){G._postWeek=wk;G._postsThisWeek=0;}if((G._postsThisWeek||0)>=2){notify('📵 نشرت كثير هذا الأسبوع؛ انتظر المباراة القادمة');return;}G._postsThisWeek=(G._postsThisWeek||0)+1;
 const requestedPlatform=$('phonePlatform')?.value;const platform=['snapchat','tiktok','insta'].includes(requestedPlatform)?requestedPlatform:choice(['snapchat','tiktok','insta']);const base=Math.max(3,Math.round((G.fame+G.overall/2)*randInt(2,14)));
 const post={text,platform,likes:base*randInt(8,80),comments:randInt(1,Math.max(2,Math.round(base/2))),replies:[],date:formatGameDate()};G.phonePosts.unshift(post);G.phonePosts=G.phonePosts.slice(0,40);
 let gain=Math.round(post.likes*(0.3+Math.random()*0.7));gain=Math.min(gain,300+G.fame*40+Math.round(G.followers*0.005));if(chance(.12))gain=Math.round(gain*randInt(2,5));G.social[platform]=(G.social[platform]||0)+gain;G.followers+=gain;if(chance(.15))G.fame=clamp(G.fame+1,0,100);
 addPhoneNews('📱 تفاعل الجماهير',`انتشر منشورك على ${platform==='snapchat'?'سناب شات':platform==='tiktok'?'تيك توك':'إنستغرام'} واكتسب ${fmt(gain)} متابع جديد.`);save();render();

function engagePost(i){ensureBigUpdateState();const p=G.phonePosts[i];if(!p)return;if(p._engaged){notify('سبق وتفاعلت مع هذا المنشور');return;}p._engaged=true;p.likes=(p.likes||0)+randInt(3,25);p.comments=(p.comments||0)+1;p.replies=p.replies||[];p.replies.unshift(choice(['أداء رائع! استمر 🔥','ننتظر المباراة القادمة ⚽','فخورون بك يا بطل 💚','ركز على الملعب والباقي يأتي!']));G.socialComments=(G.socialComments||0)+1;if(chance(.4))G.followers+=randInt(10,300);save();render();}
function requestSponsorship(){ensureBigUpdateState();if(G.fame<15){notify('تحتاج شهرة أعلى لجذب الرعاة');return;}if(G.sponsorships.length>=10){notify('وصلت إلى 10 عقود رعاية مسجلة');return;}if(G._sponsorSeason===G.season){notify('وقعت عقد رعاية هذا الموسم؛ الشركات تنتظر الموسم القادم');return;}G._sponsorSeason=G.season;const brands=['شركة رياضية','علامة أحذية','مشروب رياضي','شركة تقنية','متجر ملابس رياضية','شركة سيارات','منصة ألعاب'];const brand=choice(brands)+' '+randInt(1,99);const value=Math.round((G.fame*G.fame*250+G.followers*.08+G.overall*1000)/1000)*1000;G.sponsorships.push({brand,value,status:'نشط'});G.money+=value;G.financialLog.unshift({t:'income',m:value,d:'عقد رعاية: '+brand});addPhoneNews('🤝 عقد رعاية جديد',`وقعت اتفاقية مع ${brand} بقيمة ${fmt(value)}.`);G.fame=clamp(G.fame+2,0,100);save();render();}
function updateLegendProgress(){
  ensureBigUpdateState();
  G._bestSeasonGoals=Math.max(G._bestSeasonGoals||0,G.seasonGoals||0);
  G._bestSeasonAssists=Math.max(G._bestSeasonAssists||0,G.seasonAssists||0);
  // كل المسارات تتقدم في الخلفية، لا المسار النشط فقط
  Object.keys(LEGEND_PATHS).forEach(k=>{
    const def=LEGEND_PATHS[k],data=G.legendPaths[k];if(!def||!data)return;
    const complete=!!def.complete(G);
    data.progress=complete?100:Math.min(99,Math.round(legendPathScore(k)*100));
    if(complete&&!data.complete){data.complete=true;data.completedAt=G.season;G.legendBadges.push(def.reward);addPhoneNews('🏅 إنجاز مسار الأسطورة',`أكملت مسار ${def.name} وحصلت على لقب ${def.reward}.`);notify('🏅 اكتمل مسار '+def.name+'!');}
    if(def.master(G)&&!data.mastered){data.mastered=true;data.masteredAt=G.season;G.legendBadges.push('إتقان '+def.name);}
  });
  if(['goals','maestro','captain','superstar'].every(k=>G.legendPaths[k]?.complete))G.legendPaths.goat.unlocked=true;
}
function legendPathScore(k){const g=G;switch(k){case'goals':return Math.min(1,g.totalGoals/100);case'maestro':return Math.min(1,g.totalAssists/50);case'captain':return Math.min(1,g.trophies.length/5);case'superstar':return Math.min(1,g.followers/1000000);case'goat':return Math.min(1,(['goals','maestro','captain','superstar'].filter(x=>g.legendPaths[x]?.complete).length/4));default:return 0;}}
function chooseLegendPath(k){ensureBigUpdateState();const d=LEGEND_PATHS[k];if(!d)return;if(k==='goat'&&!G.legendPaths.goat.unlocked){notify('افتح المسارات الأربعة أولًا لفتح مسار الأعظم');return;}if(G.activeLegendPath&&G.activeLegendPath!==k){if(G.money<50000){notify('تغيير المسار يحتاج 50,000');return;}G.money-=50000;G.pathSkillPoints[G.activeLegendPath]=Math.floor((G.pathSkillPoints[G.activeLegendPath]||0)*.75);G.legendPathHistory.unshift({from:G.activeLegendPath,to:k,season:G.season});G.financialLog.unshift({t:'expense',m:50000,d:'تغيير مسار الأسطورة'});}
 G.activeLegendPath=k;G.legendPaths[k].started=true;addPhoneNews('🌟 مسار جديد',`اخترت مسار ${d.name}. مدربك الأسطوري المساند: ${d.mentor}.`);save();render();}
function buyLegendTreeUpgrade(pathId,stat){
 ensureBigUpdateState();
 if(G.activeLegendPath!==pathId){notify('اختر هذا المسار أولًا لتطوير شجرته');return;}
 const def=LEGEND_PATHS[pathId];if(!def||!def.skills.includes(stat)){notify('هذه المهارة ليست ضمن شجرة المسار');return;}
 if(pathId==='goat'&&!G.legendPaths.goat.unlocked){notify('افتح المسارات الأربعة الأساسية أولًا');return;}
 G.legendTreeLevels[pathId]=G.legendTreeLevels[pathId]||{};
 const level=G.legendTreeLevels[pathId][stat]||0;
 if(level>=3){notify('وصلت هذه المهارة إلى الحد الأعلى في شجرة المسار');return;}
 const cost=level+1,points=G.pathSkillPoints[pathId]||0;
 if(points<cost){notify(`تحتاج ${cost} نقاط من شجرة المسار`);return;}
 if((G.skills[stat]||0)>=99){notify('وصلت المهارة إلى الحد الأعلى');return;}
 G.pathSkillPoints[pathId]=points-cost;G.legendTreeLevels[pathId][stat]=level+1;
 G.skills[stat]=clamp((G.skills[stat]||60)+1,35,99);refreshOverallFromSkills();
 addPhoneNews('🌳 تطور في شجرة الأسطورة',`طورت ${SKILL_LABELS[stat]} في مسار ${def.name} إلى المستوى ${level+1}.`);
 save();render();
}

function agentCareerLog(text){
  if(!G)return;G.agentCareer=G.agentCareer||{trust:55,focus:'balanced',meetings:0,lastMeetingMatch:-99,successfulDeals:0,history:[],lastReport:null};
  G.agentCareer.history.unshift({date:formatGameDate(),text:String(text)});G.agentCareer.history=G.agentCareer.history.slice(0,12);
}
function setAgentCareerFocus(value){
  if(!G||!AGENT_CAREER_FOCUSES[value])return;
  G.agentCareer=G.agentCareer||{trust:55,focus:'balanced',meetings:0,lastMeetingMatch:-99,successfulDeals:0,history:[],lastReport:null};
  const old=G.agentCareer.focus;G.agentCareer.focus=value;
  if(old!==value){G.agentCareer.trust=clamp(G.agentCareer.trust+1,0,100);agentCareerLog('تم تحديث هدف المسيرة: '+AGENT_CAREER_FOCUSES[value].name+'.');notify('🎯 حدّثت هدفك مع الوكيل.');}
  save();render();
}
function agentMeeting(){
  if(!G)return;G.agentCareer=G.agentCareer||{trust:55,focus:'balanced',meetings:0,lastMeetingMatch:-99,successfulDeals:0,history:[],lastReport:null};
  const ac=G.agentCareer;
  if((G.totalMatches||0)-(ac.lastMeetingMatch??-99)<3){notify('🗓️ خلّ بين اجتماعات الوكيل ثلاث مباريات على الأقل حتى يكون للاجتماع معنى.');return;}
  ac.meetings++;ac.lastMeetingMatch=G.totalMatches||0;ac.trust=clamp(ac.trust+2,0,100);
  const focus=AGENT_CAREER_FOCUSES[ac.focus]||AGENT_CAREER_FOCUSES.balanced;
  let advice='';
  if(G.academyPhase)advice='أهم شيء الآن هو التطور وإثبات نفسك في مباريات الأكاديمية. الانتقال الاحترافي لن يُفرض عليك قبل أن تأتي فرصة مناسبة.';
  else if(!isTransferWindow())advice='نافذة الانتقالات مغلقة الآن. سنستغل الفترة الحالية لمتابعة مستواك وتجهيز قائمة أندية، ولا يوجد انتقال فوري.';
  else if((G.seasonMatches||0)>=4&&(G.ratingSum/Math.max(1,G.seasonMatches))<6.5)advice='مستواك الأخير يحتاج إلى تحسن قبل طلب عقد أكبر. أنصحك بالتركيز على الأداء ثم نعيد تقييم السوق.';
  else if(ac.focus==='playing_time')advice='سأعطي الأولوية لدورك المتوقع واحتياج النادي لمركزك، وليس لقوة النادي فقط. لا أستطيع ضمان المشاركة الأساسية.';
  else if(ac.focus==='trophies')advice='سنوازن بين قوة النادي وفرص المنافسة على البطولات، مع الانتباه إلى صعوبة الفوز بمكان أساسي.';
  else if(ac.focus==='salary')advice='سأقارن الرواتب المتوقعة وميزانيات الأندية. تذكّر أن الراتب الأكبر قد يأتي مع دور أقل داخل الفريق.';
  else if(ac.focus==='development')advice='سأبحث عن نادٍ يناسب مستواك الحالي ويمنحك فرصة واقعية للتطور بدل الانتقال إلى تحدٍ أكبر من اللازم.';
  else advice='سنقارن قوة النادي والراتب والدور المتوقع واحتياج الفريق لمركزك قبل اتخاذ قرار.';
  ac.lastReport={date:formatGameDate(),title:'ملخص اجتماع الوكيل',text:advice,focus:ac.focus};
  agentCareerLog('اجتماع مهني: '+advice);save();render();
}
function agentScoutClubs(){
  if(!G)return;ensureBigUpdateState();
  const ac=G.agentCareer||(G.agentCareer={trust:55,focus:'balanced',meetings:0,lastMeetingMatch:-99,successfulDeals:0,history:[],lastReport:null});
  if(G.academyPhase||G.age<17){notify('🎓 ركّز حاليًا على الأكاديمية؛ الاستكشاف الاحترافي متاح بعد بلوغ السن المناسب.');return;}
  const posNeed=({'مهاجم':'مهاجم','جناح':'جناح','وسط':'وسط','مدافع':'دفاع','حارس':'حارس'})[G.pos]||'مهاجم';
  const clubs=[];
  Object.keys(LEAGUES).forEach(lid=>LEAGUES[lid].clubs.forEach(c=>{
    if(c.n===G.clubName)return;
    const strength=worldStrength(lid,c.n,c.s),profile=worldClub(lid,c.n);
    const diff=Math.abs(strength-G.overall);
    if(strength>G.overall+24||strength<G.overall-23)return;
    let score=55-diff*1.5;
    if(profile?.transferNeed===posNeed)score+=12;
    if(profile?.budget>(G.marketValue||0)*8)score+=5;
    if(ac.focus==='playing_time')score+=(G.overall-strength)*1.35+(profile?.transferNeed===posNeed?8:0);
    else if(ac.focus==='trophies')score+=strength*.65+(strength>=82?8:0);
    else if(ac.focus==='salary')score+=Math.min(16,(profile?.budget||0)/Math.max(1,(G.marketValue||1)*3));
    else if(ac.focus==='development')score+=Math.max(-8,12-diff)+(strength<=G.overall+3?5:0);
    else score+=Math.min(8,Math.abs(strength-G.clubStrength)*.25);
    score+=((ac.trust||50)-50)*.04+(G.agent?.quality||.6)*3;
    clubs.push({club:c.n,league:lid,strength,score:Math.round(score),need:profile?.transferNeed||'متوازن',budget:profile?.budget||0,goal:profile?.goal||'تحسين المركز'});
  }));
  clubs.sort((a,b)=>b.score-a.score);
  const picks=clubs.slice(0,3).map(c=>({...c,roleRank:clamp(c.strength<=G.overall-7?3:c.strength<=G.overall+1?2:c.strength<=G.overall+10?1:0,0,3),wage:calcSalary(c.strength,G.overall,G.age)}));
  ac.lastReport={date:formatGameDate(),title:'تقرير استكشاف الأندية',text:`وجدت ${picks.length} خيارات مبدئية بناءً على هدفك: ${(AGENT_CAREER_FOCUSES[ac.focus]||AGENT_CAREER_FOCUSES.balanced).name}. هذه ترشيحات وليست عروضًا رسمية أو ضمانًا لقبولك.`,clubs:picks,focus:ac.focus};
  agentCareerLog('تم إعداد تقرير استكشاف للأندية وفق هدف '+(AGENT_CAREER_FOCUSES[ac.focus]||AGENT_CAREER_FOCUSES.balanced).name+'.');save();render();
}
function agentRequestClubOffer(clubName,leagueId){
  if(!G)return;const ac=G.agentCareer||{};
  if(!isTransferWindow()){notify('🔒 نافذة الانتقالات مغلقة. احتفظ بالترشيح واطلب العرض في يناير أو يونيو–أغسطس.');return;}
  if(G.academyPhase||G.age<17){notify('🎓 لا يمكن طلب عرض انتقال احترافي خلال مرحلة الأكاديمية.');return;}
  if(G.offer){notify('📩 لديك عرض مفتوح بالفعل. راجعه أو ارفضه قبل طلب عرض آخر.');return;}
  const c=(ac.lastReport?.clubs||[]).find(x=>x.club===clubName&&x.league===leagueId);
  if(!c){notify('انتهت صلاحية هذا الترشيح؛ أعد استكشاف السوق.');return;}
  const role=NEGOTIATION_ROLES[clamp(c.roleRank??0,0,3)];
  G.offer={club:c.club,league:c.league,strength:c.strength,fee:Math.round((G.marketValue||0)*1.05/10000)*10000,wage:c.wage||calcSalary(c.strength,G.overall,G.age),contractYears:G.age>=32?2:3,role,clubGoal:c.goal||'تحسين المركز',loanPossible:c.strength>G.overall+8,signingBonus:0,agentRequested:true};
  G.offerPool=[G.offer];G._selectedOfferIndex=0;ac.trust=clamp((ac.trust||50)+2,0,100);agentCareerLog(`طلب الوكيل فتح مفاوضات أولية مع ${c.club}. لم يتم توقيع أي عقد بعد.`);
  addPhoneNews('🤝 تحرك الوكيل',`طلب وكيلك فتح مفاوضات أولية مع ${c.club}. القرار النهائي لك بعد مراجعة العرض.`);save();render();
}
function viewAgentCareer(){
  ensureBigUpdateState();const ac=G.agentCareer||{trust:55,focus:'balanced',meetings:0,successfulDeals:0,history:[],lastReport:null};

  const trustLabel=ac.trust>=80?'علاقة قوية جدًا':ac.trust>=60?'علاقة جيدة':ac.trust>=40?'علاقة مستقرة':'العلاقة تحتاج إلى اهتمام';

  const reportHTML=report?`<div class="event-box"><b>${escapeGameText(report.title||'تقرير الوكيل')}</b><p class="sub">${escapeGameText(report.text||'')}</p>${report.clubs?.length?report.clubs.map(c=>`<div class="item-card" style="align-items:flex-start"><div style="flex:1;min-width:0"><b>${escapeGameText(c.club)}</b><div class="sub" style="margin:4px 0">${escapeGameText(LEAGUES[c.league]?.name||c.league)} · قوة ${c.strength} · احتياج المركز: ${escapeGameText(c.need||'—')}</div><div class="row"><span>الدور المتوقع</span><b>${escapeGameText(NEGOTIATION_ROLES[c.roleRank]||'موهبة واعدة')}</b></div><div class="row"><span>راتب تقديري</span><b>${fmt(c.wage||0)}</b></div><div class="sub">هدف النادي: ${escapeGameText(c.goal||'تحسين المركز')}</div><button class="ghost sm" onclick="agentRequestClubOffer('${String(c.club).replace(/'/g,"\\'")}','${c.league}')">📩 طلب عرض رسمي</button></div></div>`).join(''):''}</div>`:'<p class="sub">لم تعقد اجتماعًا أو تطلب تقريرًا بعد. ابدأ باختيار هدفك المهني ثم اطلب من وكيلك مراجعة وضعك.</p>';
  return `<div class="card"><h2>🤝 وكيلك ومسيرتك المهنية</h2><p class="sub">هذا النظام يضيف دورًا فعليًا للوكيل فوق نظام الوكلاء والانتقالات الموجود: تحدد هدفك، تطلب المشورة، ثم تستكشف أندية وتقرر بنفسك إن كنت تريد فتح مفاوضات.</p><div class="grid"><div class="stat"><b>${escapeGameText(G.agent?.name||'الوكيل الذاتي')}</b><span>الوكيل الحالي</span></div><div class="stat"><b>${Math.round((G.agent?.cut||0)*100)}%</b><span>العمولة</span></div><div class="stat"><b>${ac.trust}/100</b><span>العلاقة المهنية</span></div><div class="stat"><b>${ac.successfulDeals||0}</b><span>صفقات مكتملة بمساعدة الوكيل</span></div></div><div class="bar"><div class="bar-fill ${ac.trust<35?'danger':ac.trust<60?'warn':''}" style="width:${ac.trust}%"></div></div><p class="sub">${trustLabel}. تؤثر العلاقة المهنية على المساعدة التفاوضية بصورة محدودة؛ الوكيل لا يضمن قبول الأندية.</p></div><div class="card"><h2>🎯 هدفك المهني</h2><p class="sub">اختر ما تريد أن يعطيه الوكيل أولوية عند مقارنة الأندية. تستطيع تغييره في أي وقت.</p><label for="agentCareerFocus">أولوية المسيرة</label><select id="agentCareerFocus" onchange="setAgentCareerFocus(this.value)">${Object.entries(AGENT_CAREER_FOCUSES).map(([id,f])=>`<option value="${id}" ${ac.focus===id?'selected':''}>${f.icon} ${f.name}</option>`).join('')}</select><div class="event-box"><b>${focus.icon} ${focus.name}</b><p class="sub">${focus.desc}</p><p class="sub">${focus.tip}</p></div><div class="grid2"><button onclick="agentMeeting()">🗣️ اجتماع مهني</button><button class="ghost" onclick="agentScoutClubs()">🔎 استكشاف الأندية</button></div><p class="sub">الاجتماعات محدودة بمرة كل ثلاث مباريات حتى لا تتحول العلاقة إلى نقاط مجانية. تقارير السوق ترشيحات فقط؛ لا تصبح عروضًا رسمية إلا إذا طلبت ذلك وكانت نافذة الانتقالات مفتوحة.</p></div><div class="card"><h2>📋 آخر تقرير</h2>${reportHTML}</div><div class="card"><h2>🗂️ سجل الوكيل</h2>${(ac.history||[]).slice(0,8).map(h=>`<div class="row"><span>${escapeGameText(h.date||'')}</span><b style="max-width:70%;text-align:right">${escapeGameText(h.text||'')}</b></div>`).join('')||'<p class="sub">سيظهر هنا سجل الاجتماعات والترشيحات.</p>'}</div>`;
}

function viewHub(){ensureCareerSystems();ensureBigUpdateState();let body='';if(subTab==='main')body=viewMain();else if(subTab==='table')body=viewTable();else if(subTab==='scorers')body=viewScorers();else if(subTab==='training')body=viewTraining();else if(subTab==='team')body=viewSquad();else if(subTab==='club')body=viewClubDetails();else if(subTab==='development')body=viewDevelopment();else if(subTab==='stats')body=viewStats();else if(subTab==='heatmap')body=viewHeatMap();else if(subTab==='health')body=viewHealth();else if(subTab==='money')body=viewMoney();else if(subTab==='relations')body=viewRelations();else if(subTab==='media')body=viewMedia();else if(subTab==='national')body=viewNational();else if(subTab==='assets')body=viewAssets();else if(subTab==='achievements')body=viewAchievements();else if(subTab==='challenges')body=viewChallenges();else if(subTab==='career')body=viewCareer();else if(subTab==='settings')body=viewSettings();else if(subTab==='legend')body=viewLegendPaths();else if(subTab==='market')body=viewTransferMarket();else if(subTab==='personality')body=viewPersonalityArchetypes();else if(subTab==='agent')body=viewAgentCareer();
return `<div class="card"><div class="row"><span>📅 التاريخ داخل اللعبة</span><b>${formatGameDate()}</b></div><div class="row"><span>العمر</span><b>${G.age} سنة ${G.academyPhase?'· 🎓 أكاديمية عمك خالد':'· ⚽ محترف'}</b></div></div><div class="tabs">${tab('main','🏠')}${tab('table','🏆')}${tab('scorers','🥇')}${tab('training','🏋️')}${tab('team','👥 الفريق')}${tab('club','🏟️ النادي')}${tab('development','📈 التطوير')}${tab('stats','📊')}${tab('heatmap','🗺️')}${tab('health','❤️')}${tab('money','💼')}${tab('relations','🤝 العلاقات')}${tab('agent','🧑‍💼 الوكيل')}${tab('media','📱 الجوال')}${tab('national','🌍 المنتخب')}${tab('market','🔁 الانتقالات')}${tab('legend','🌟 الأسطورة')}${tab('personality','🧬 الشخصية')}${tab('assets','🛒 المتجر')}${tab('challenges','🎯')}${tab('achievements','🏅')}${tab('career','📜')}${tab('settings','⚙️')}</div>${body}${G.offer?viewOfferInline():''}${G.pendingRetirement?viewRetirementInline():''}`;}
function buyAsset(id){ensureBigUpdateState();const a=ASSETS_CATALOG.find(x=>x.id===id);if(!a)return;if(G.age<a.minAge){notify('عمرك أقل من المطلوب');return;}if(a.type==='equipment'&&G.inventory.some(x=>x.id===a.id)){notify('تملك هذا الجهاز بالفعل');return;}if(G.money<a.price){notify('رصيدك غير كافٍ');return;}G.money-=a.price;G.financialLog.unshift({t:'expense',m:a.price,d:`شراء ${a.name}`});if(a.type==='equipment'){G.inventory.push({id:a.id,name:a.name,benefit:a.benefit,boughtAt:formatGameDate()});notify(`اشتريت ${a.name}. فائدته تحتاج استخدامًا مناسبًا ولا يرفع المهارات تلقائيًا.`);}else{G.assets.push({...a,value:a.price,income:a.income||0,boughtAt:G.season});notify(`اشتريت ${a.name}`);}checkAchievements();save();render();}

function getNegotiationLimits(o){

function buildMatchMoments(session){
  const lineup=session.lineup||G.lineupStatus||'starter';
  // وصول الكرة للاعب غير مضمون: بعض المباريات تمر بلا لحظة قرار، وبعضها بلحظة أو اثنتين، ونادرًا ثلاث.
  const r=Math.random();
  let wanted=r<.13?0:r<.48?1:r<.82?2:3;
  const roleBonus=G.pos==='وسط'?.08:['جناح','مهاجم'].includes(G.pos)?.04:0;
  if(lineup==='bench')wanted=Math.min(wanted,Math.random()<.6?0:1);
  else if(wanted===0&&Math.random()<roleBonus)wanted=1;
  const pool=LIVE_MATCH_MOMENTS.slice();
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const selected=pool.slice(0,wanted).sort((a,b)=>a.minute-b.minute);
  const available=lineup==='bench'?[72,79,85]:[12,29,47,65,81];
  return selected.map((m,i)=>({...m,minute:available[Math.min(i,available.length-1)]||80}));
}
function playCrowdSound(kind='cheer'){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const ctx=window.__masiratCrowdAudio||(window.__masiratCrowdAudio=new AC());
    if(ctx.state==='suspended')ctx.resume();
    const now=ctx.currentTime,duration=kind==='goal'?1.35:.65;
    const buffer=ctx.createBuffer(1,Math.floor(ctx.sampleRate*duration),ctx.sampleRate);
    const data=buffer.getChannelData(0);
    for(let i=0;i<data.length;i++){
      const fade=Math.min(1,i/(ctx.sampleRate*.08), (data.length-i)/(ctx.sampleRate*.25));
      data[i]=(Math.random()*2-1)*Math.max(0,fade)*.24;
    }
    const noise=ctx.createBufferSource();noise.buffer=buffer;
    const filter=ctx.createBiquadFilter();filter.type='bandpass';filter.frequency.value=kind==='goal'?1150:750;filter.Q.value=.65;
    const gain=ctx.createGain();gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(kind==='goal'?.20:.075,now+.08);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
    noise.connect(filter);filter.connect(gain);gain.connect(ctx.destination);noise.start(now);noise.stop(now+duration);
    if(kind==='goal'){
      // هتاف قصير فوق ضجيج الجمهور، دون موسيقى خلفية.
      [420,510,610].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,now+.03*i);o.frequency.exponentialRampToValueAtTime(f*1.24,now+.55);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.025,now+.08);g.gain.exponentialRampToValueAtTime(.0001,now+.72);o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+.75);});
    }
  }catch(e){}
}

function ensureCoachRosterData(){
  if(!G)return;
  G.squadPlayers=Array.isArray(G.squadPlayers)?G.squadPlayers:[];
  G.rivalPlayers=Array.isArray(G.rivalPlayers)?G.rivalPlayers:[];
  const academy=!!G.academyPhase;
  const bandKey=academy?'academy':'professional';
  const low=academy?58:68, high=academy?68:77;
  if(G._coachRosterBandV1!==bandKey){
    [...G.squadPlayers,...G.rivalPlayers].forEach((p,i)=>{
      if(!p||p.id==='user')return;
      const target=randInt(low,high);
      p.overall=target;
      p.stats=p.stats&&typeof p.stats==='object'?p.stats:makeSkills(target);
      Object.keys(SKILL_LABELS).forEach(k=>{p.stats[k]=clamp(target+randInt(-5,5),academy?48:58,86);});
      p.potential=Math.max(target,Number(p.potential)||target+randInt(4,14));
      if(p.potential<target)p.potential=target+randInt(3,12);
    });
    G._coachRosterBandV1=bandKey;
  }
  const rosterPositions=['حارس','حارس','مدافع','مدافع','مدافع','مدافع','مدافع','مدافع','وسط','وسط','وسط','وسط','وسط','وسط','جناح','جناح','مهاجم','مهاجم'];
  while(G.squadPlayers.length<18){
    const i=G.squadPlayers.length;
    const pos=rosterPositions[i]||choice(['مدافع','وسط','جناح','مهاجم']);
    G.squadPlayers.push(makeWorldPlayer('team_auto_'+G.season+'_'+i,choice(FIRST_NAMES)+' '+choice(MID_NAMES),G.clubName,pos,randInt(low,high),randInt(18,33)));
  }
  if(!G.squadPlayers.some(p=>/حارس/.test(p.position||''))){
    const keeper=G.squadPlayers.reduce((a,b)=>(a.overall||0)<(b.overall||0)?a:b);
    keeper.position='حارس';
  }
  [...G.squadPlayers,...G.rivalPlayers].forEach((p,i)=>{
    if(!p)return;
    if(!p.stats)p.stats=makeSkills(p.overall||70);
    if(p.potential==null)p.potential=clamp((p.overall||70)+randInt(3,15),p.overall||68,93);
    p.potential=clamp(Number(p.potential)||p.overall||70,p.overall||68,95);
    if(p.developmentXP==null)p.developmentXP=0;
    if(!p.trainingEnvironment)p.trainingEnvironment=Number((0.78+Math.random()*0.44).toFixed(2));
    if(p.professionalism==null)p.professionalism=randInt(45,95);
    if(p.coachFit==null)p.coachFit=randInt(40,85);
    if(p.morale==null)p.morale=randInt(45,80);
    if(p.fatigue==null)p.fatigue=randInt(5,35);
    if(!p.position)p.position=choice(['مدافع','وسط','جناح','مهاجم']);
  });
  if(G.world&&Array.isArray(G.world.competitors)&&G.world._coachRatingsV1!==true){
    G.world.competitors.forEach(p=>{
      p.overall=clamp(Number(p.overall)||randInt(68,77),68,77);
      p.potential=Math.max(p.overall,clamp(Number(p.potential)||p.overall+randInt(3,14),p.overall,94));
      if(p.developmentXP==null)p.developmentXP=0;
      if(!p.trainingEnvironment)p.trainingEnvironment=Number((0.78+Math.random()*0.44).toFixed(2));
      if(p.professionalism==null)p.professionalism=randInt(45,95);
    });
    G.world._coachRatingsV1=true;
  }
}
