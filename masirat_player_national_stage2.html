function playerRoleScore(p,role){
  const pos=String(p?.position||p?.pos||'');
  if(role==='حارس')return /حارس/.test(pos)?22:-26;
  if(/ظهير/.test(role))return /مدافع/.test(pos)?11:/جناح/.test(pos)?5:/وسط/.test(pos)?1:-10;
  if(/قلب دفاع|دفاع/.test(role))return /مدافع/.test(pos)?14:/وسط/.test(pos)?1:-10;
  if(/وسط دفاعي/.test(role))return /وسط/.test(pos)?12:/مدافع/.test(pos)?4:-9;
  if(/وسط هجومي|صانع/.test(role))return /وسط/.test(pos)?12:/جناح/.test(pos)?6:/مهاجم/.test(pos)?2:-9;
  if(/وسط/.test(role))return /وسط/.test(pos)?13:/جناح/.test(pos)?3:/مدافع/.test(pos)?1:-9;
  if(/جناح/.test(role))return /جناح/.test(pos)?14:/مهاجم/.test(pos)?6:/وسط/.test(pos)?2:-10;
  if(/مهاجم/.test(role))return /مهاجم/.test(pos)?15:/جناح/.test(pos)?5:-11;
  return 0;
}
function playerCoachScore(p,role=''){
  if(!p)return -999;
  const overall=Number(p.overall)||50;
  const form=(Number(p.form??p.morale??60)-60)*0.055;
  const fatigue=clamp(Number(p.fatigue)||0,0,100)*0.055;
  const morale=(Number(p.morale??60)-60)*0.025;
  const coachFit=(Number(p.coachFit)||60)/60;
  return overall+playerRoleScore(p,role)+form-fatigue+morale+coachFit;
}

  if(avgFatigue>58){formation='4-2-3-1';style='دفاع منظم';plan='defend';reason='إدارة الإجهاد وحماية المساحات';}
  else if(opp>own+5){formation=snap.defenders>=snap.midfielders?'4-2-3-1':'4-4-2';style='هجمات مرتدة';plan='counter';reason='استغلال المساحات أمام خصم أقوى';}
  else if(own>opp+6&&snap.strikers>=snap.midfielders-2){formation='4-4-2';style='هجوم سريع';plan='attack';reason='زيادة الضغط الهجومي أمام خصم أضعف';}
  else if(snap.wingers>=snap.midfielders-1){formation='4-3-3';style='ضغط عالٍ';plan='attack';reason='استغلال سرعة الأطراف والضغط المبكر';}
  else {formation='4-2-3-1';style='استحواذ وبناء من الخلف';plan='balanced';reason='السيطرة على وسط الملعب';}
  if(G.coach?.style==='ضغط عالٍ'&&avgFatigue<38&&opp<=own+3){style='ضغط عالٍ';plan='attack';}
  return {formation,style,plan,reason,opponentStrength:opp,ownStrength:own,avgFatigue};
}
function applyCoachPlan(opponent,quiet=false){
  const plan=recommendCoachPlan(opponent);
  const changed=G.clubFormation!==plan.formation||G.coach?.style!==plan.style;
  G.clubFormation=plan.formation;
  G.clubTacticalStyle=plan.style;
  if(G.coach){G.coach.plan=plan.formation;G.coach.style=plan.style;G.coach.lastDecision=plan.reason;G.coach.lastOpponentStrength=plan.opponentStrength;G.coach.lastDecisionTurn=G.turnIndex;}
  if(changed&&!quiet&&G.world&&G.turnIndex%3===0)worldNews(`🧠 ${G.coach?.name||'المدرب'} يغيّر الخطة إلى ${plan.formation} (${plan.style}) بسبب ${plan.reason}.`);
  return plan;
}
function buildCoachXI(includeUser=false){
  ensureCareerSystems();
  const formation=G.clubFormation||G.coach?.plan||'4-3-3';
  const roles=formationRolesFor(formation);
  let pool=[...(G.squadPlayers||[])].filter(p=>p&&p.id!=='user').map(p=>({...p,_sourceId:p.id}));
  if(includeUser&&G.lineupStatus==='starter')pool.push({id:'__user__',_sourceId:'__user__',name:G.name+' (أنت)',position:G.pos,age:G.age,overall:G.overall,form:G.form||50,fatigue:G.fatigue||0,morale:G.playerMorale||60,coachFit:G.coachRelation||60,_user:true,stats:G.skills});
  const starters=[];
  roles.forEach(role=>{
    let best=-1,bestScore=-Infinity;
    pool.forEach((p,i)=>{if(p._used)return;let score=playerCoachScore(p,role);if(p._user)score+=(G.coachRelation-50)*0.035;if(score>bestScore){bestScore=score;best=i;}});
    if(best>=0){const p=pool[best];p._used=true;p._assignedRole=role;starters.push(p);}else starters.push({_empty:true,id:'empty_'+role,name:'مركز شاغر',position:role,overall:'—',_assignedRole:role});
  });
  const bench=pool.filter(p=>!p._used).sort((a,b)=>playerCoachScore(b,b.position)-playerCoachScore(a,a.position));
  return {formation,roles,starters,bench};
}
function coachLineupStrengthBonus(){
  const lineup=buildCoachXI(false).starters.filter(p=>!p._empty);
  if(!lineup.length)return 0;
  const avg=lineup.reduce((s,p)=>s+(Number(p.overall)||65),0)/lineup.length;
  return clamp((avg-72.5)*0.12,-1.5,1.5);
}
function determineLineup(){
  ensureCareerSystems();
  if((G.energy||0)<18||(G.health||0)<20||G.injury)return 'out';
  const same=(G.squadPlayers||[]).filter(p=>{
    const pos=String(p.position||'');
    if(G.pos==='حارس')return /حارس/.test(pos);
    if(G.pos==='مدافع')return /مدافع/.test(pos);
    if(G.pos==='وسط')return /وسط/.test(pos)||/جناح/.test(pos);
    if(G.pos==='جناح')return /جناح/.test(pos)||/مهاجم/.test(pos);
    return /مهاجم/.test(pos)||/جناح/.test(pos);
  });
  const pool=same.length?same:(G.squadPlayers||[]);
  const userScore=(Number(G.overall)||50)+playerRoleScore({position:G.pos},G.pos)+((Number(G.form)||50)-50)*0.06-clamp(Number(G.fatigue)||0,0,100)*0.07+((Number(G.coachRelation)||50)-50)*0.035;
  const scores=pool.map(p=>playerCoachScore(p,p.position)).sort((a,b)=>b-a);
  const rank=scores.filter(v=>v>userScore).length;
  const best=scores[0]??(G.clubStrength||60);
  const gap=best-userScore;
  if(G.academyPhase){
    if(rank===0||gap<=1.5)return 'starter';
    if(rank<=3||gap<=6)return 'bench';
    if(rank<=6||gap<=10)return 'bench';
    return 'out';
  }
  if(rank===0||gap<=1.5)return 'starter';
  if(rank<=2||gap<=5.5)return 'starter';
  if(rank<=5||gap<=10)return 'bench';
  if((G.coachRelation||50)>=85&&gap<=12)return 'bench';
  return 'out';
}
function coachLineupSummary(){
  const x=buildCoachXI(false);
  const chosen=x.starters.filter(p=>!p._empty);
  const avg=chosen.length?Math.round(chosen.reduce((s,p)=>s+(Number(p.overall)||0),0)/chosen.length):0;
  return {formation:x.formation,starters:chosen,bench:x.bench,average:avg};
}

function simulateIndependentPlayerDevelopment(){
  if(!G||G._independentDevelopmentTurn===G.turnIndex)return;
  G._independentDevelopmentTurn=G.turnIndex;
  ensureCareerSystems();
  const xi=buildCoachXI(false).starters.filter(p=>!p._empty);
  const starterIds=new Set(xi.map(p=>p.id));
  const all=[...(G.squadPlayers||[]),...(G.rivalPlayers||[])];
  all.forEach(p=>{
    if(!p||p.id==='user')return;
    const age=Number(p.age)||24,overall=Number(p.overall)||68,potential=Number(p.potential)||overall+5;
    const gap=Math.max(0,potential-overall);
    const ageFactor=age<=20?1.35:age<=23?1.2:age<=26?0.95:age<=29?0.68:age<=31?0.42:age<=33?0.18:0.04;
    const playing=starterIds.has(p.id)?1.35:(p.matches>0?0.85:0.55);
    const environment=clamp(Number(p.trainingEnvironment)||1,0.65,1.4);
    const professionalism=0.65+(clamp(Number(p.professionalism)||60,0,100)/100)*0.65;
    const coachQuality=0.8+(clamp(Number(p.coachFit)||60,0,100)/300);
    const potentialFactor=gap>0?clamp(gap/9,0.12,1):0.08;
    const formFactor=0.85+clamp(Number(p.morale)||60,0,100)/400;
    let xpGain=ageFactor*environment*professionalism*coachQuality*potentialFactor*formFactor*playing*0.075;
    if(age>=30&&overall>potential-2)xpGain*=0.55;
    p.developmentXP=(Number(p.developmentXP)||0)+xpGain;
    p.fatigue=clamp((Number(p.fatigue)||0)+(starterIds.has(p.id)?4:1)-randInt(2,6),0,100);
    if(Math.random()<0.2)p.morale=clamp((Number(p.morale)||60)+randInt(-3,4),20,95);
    while(p.developmentXP>=1&&(Number(p.overall)||overall)<potential&&age<=32){
      const statKeys=Object.keys(p.stats||{}).filter(k=>(Number(p.stats[k])||0)<99);
      if(!statKeys.length)break;
      const key=choice(statKeys);p.stats[key]=clamp((Number(p.stats[key])||overall)+1,35,99);
      const currentOverall=Number(p.overall)||overall;
      p.overall=clamp(Math.round(weightedOverall(p.stats,p.position)),G.academyPhase?58:68,Math.min(90,potential));
      p.developmentXP-=1;
    }
    if(age>=31&&Math.random()<(age>=35?0.04:0.012)){
      const key=choice(Object.keys(p.stats||{}));if(key)p.stats[key]=clamp((Number(p.stats[key])||overall)-1,35,99);
      p.overall=clamp((Number(p.overall)||overall)-1,55,99);
    }
    p._lastDevelopmentWeek=G.world?.week||G.turnIndex||0;
  });
  // منافسو عالم اللعبة يتطورون أيضًا وفق العمر والإمكانات وبيئة التدريب الخاصة بكل لاعب.
  (G.world?.competitors||[]).forEach(p=>{
    if(p.status!=='نشط')return;
    const age=Number(p.age)||24,ov=Number(p.overall)||68,pot=Number(p.potential)||ov+5,gap=Math.max(0,pot-ov);
    const ageFactor=age<=20?1.3:age<=23?1.15:age<=26?.9:age<=29?.6:age<=31?.3:age<=34?.1:.02;
    p.developmentXP=(Number(p.developmentXP)||0)+ageFactor*(Number(p.trainingEnvironment)||1)*(0.7+(Number(p.professionalism)||60)/160)*clamp(gap/10,.1,1)*.12;
    if(p.developmentXP>=1&&ov<pot&&age<=32){p.overall=clamp(ov+1,68,Math.min(90,pot));p.developmentXP-=1;}
    if(age>=32&&Math.random()<(age>=35?.13:.04))p.overall=clamp((Number(p.overall)||ov)-1,65,90);
  });
}

  simulateIndependentPlayerDevelopment();

function adaptCoachDuringMatch(session,moment){
  if(!G||!session||!moment||Number(moment.minute)<60)return null;
  const diff=(Number(session.score?.mine)||0)-(Number(session.score?.opp)||0);
  let state='level',plan='balanced',formation='4-3-3',style='استحواذ وبناء من الخلف',reason='الحفاظ على التوازن';
  const squad=getCoachSquadSnapshot();
  if(diff<0){state='trailing';plan='attack';formation=squad.strikers>=squad.midfielders?'4-4-2':'4-3-3';style='هجوم سريع';reason='الفريق متأخر ويحتاج إلى زيادة الضغط الهجومي';}
  else if(diff>0&&Number(moment.minute)>=70){state='leading';plan='defend';formation='4-2-3-1';style='دفاع منظم';reason='الفريق متقدم ويحتاج إلى حماية النتيجة';}

function normalizeArchetypePercentages(values){

  let left=100-floored.reduce((a,b)=>a+b,0);
  const order=raw.map((v,i)=>({i,frac:v-floored[i]})).sort((a,b)=>b.frac-a.frac);
  for(let i=0;i<left;i++)floored[order[i%order.length].i]++;

}
